<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palette</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white: #ffffff;
      --bg: #f5f5f7;
      --ink: #0a0a0f;
      --ink-soft: #4a4a5a;
      --ink-muted: #9a9aaa;
      --border: #e8e8f0;

      /* Palette */
      --blue:    #5B52A0;
      --violet:  #7B72C0;
      --magenta: #C47B8E;
      --grad: linear-gradient(135deg, #7B72C0 0%, #BCC0DC 55%, #C47B8E 100%);
      --grad-soft: linear-gradient(135deg, rgba(123,114,192,0.08) 0%, rgba(188,192,220,0.08) 55%, rgba(196,123,142,0.08) 100%);

      --green:      #00875a;
      --green-soft: #e6f6f1;
      --red:        #c0392b;
      --red-soft:   #fdecea;
      --amber:      #b45309;
      --amber-soft: #fef3c7;

      --card: #ffffff;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .logo-mark {
      width: 28px; height: 28px;
      background: var(--grad);
      border-radius: 8px;
      flex-shrink: 0;
    }
    .logo-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .month-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
    }
    .classify-btn {
      background: var(--grad);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      text-decoration: none;
      display: inline-block;
    }

    /* ── LOADING ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
      gap: 14px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--violet);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: var(--ink-muted); font-weight: 400; }

    /* ── MAIN ── */
    main {
      padding: 16px 16px 60px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── MONTH TABS ── */
    .month-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 12px;
      scrollbar-width: none;
    }
    .month-tabs::-webkit-scrollbar { display: none; }
    .month-tab {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      font-family: 'Outfit', sans-serif;
      flex-shrink: 0;
    }
    .month-tab.active {
      background: var(--grad);
      border-color: transparent;
      color: white;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 20px 0 10px;
    }

    /* ── SUMMARY CARD ── */
    .summary-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 18px 20px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .summary-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--grad);
    }
    .summary-ai-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .summary-text {
      font-size: 13px;
      line-height: 1.65;
      color: var(--ink-soft);
      font-weight: 400;
    }
    .summary-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--ink-muted);
      font-weight: 400;
    }
    .spinner-sm {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--violet);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    /* ── HERO ── */
    .hero-card {
      background: var(--grad);
      border-radius: var(--radius);
      padding: 24px 22px;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .hero-card::after {
      content: '';
      position: absolute;
      bottom: -40px; right: -40px;
      width: 140px; height: 140px;
      background: rgba(255,255,255,0.07);
      border-radius: 50%;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: -20px; left: 30%;
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }
    .hero-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 6px;
    }
    .hero-amount {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
      color: white;
    }
    .hero-amount.negative { color: rgba(255,255,255,0.7); }
    .hero-note {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      margin-top: 8px;
      font-weight: 400;
    }

    /* ── LIFE UNITS ── */
    .life-units-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .unit-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border);
    }
    .unit-emoji { font-size: 22px; margin-bottom: 8px; display: block; }
    .unit-count { font-size: 34px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
    .unit-count.ok   { color: var(--blue); }
    .unit-count.warn { color: var(--amber); }
    .unit-count.bad  { color: var(--red); }
    .unit-label  { font-size: 11px; color: var(--ink-soft); margin-top: 4px; font-weight: 400; }
    .unit-detail { font-size: 10px; color: var(--ink-muted); margin-top: 2px; }

    /* ── P&L STACK ── */
    .pl-stack { display: flex; flex-direction: column; gap: 8px; }
    .pl-row {
      background: var(--white);
      border-radius: var(--radius-sm);
      padding: 13px 16px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .pl-row.total {
      background: var(--ink);
      border-color: var(--ink);
    }
    .pl-left { display: flex; align-items: center; gap: 10px; }
    .pl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .pl-name { font-size: 13px; font-weight: 600; color: var(--ink); }
    .pl-sub  { font-size: 10px; color: var(--ink-muted); margin-top: 1px; font-weight: 400; }
    .pl-amount { font-size: 16px; font-weight: 700; white-space: nowrap; }
    .pl-amount.pos { color: var(--green); }
    .pl-amount.neg { color: var(--red); }

    /* ── CATEGORIES ── */
    .cat-list { display: flex; flex-direction: column; gap: 6px; }
    .cat-row {
      background: var(--white);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .cat-row:hover { border-color: var(--violet); }
    .cat-row.open  { border-color: var(--blue); }
    .cat-row-header { padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
    .cat-bar-wrap { flex: 1; }
    .cat-name-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .cat-name { font-size: 13px; font-weight: 600; color: var(--ink); }
    .cat-eur  { font-size: 12px; font-weight: 600; }
    .cat-bar-bg { background: var(--border); border-radius: 4px; height: 3px; overflow: hidden; }
    .cat-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(0.16,1,0.3,1); }
    .cat-remaining { font-size: 10px; margin-top: 4px; font-weight: 500; }
    .cat-chevron { font-size: 9px; color: var(--ink-muted); transition: transform 0.2s; flex-shrink: 0; }
    .cat-row.open .cat-chevron { transform: rotate(180deg); }

    .cat-detail { display: none; border-top: 1px solid var(--border); }
    .cat-row.open .cat-detail { display: block; }
    .cat-tx {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      gap: 8px;
      border-bottom: 1px solid var(--bg);
    }
    .cat-tx:last-child { border-bottom: none; }
    .cat-tx:hover { background: var(--bg); }
    .cat-tx-vendor { font-size: 12px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .cat-tx-date   { font-size: 10px; color: var(--ink-muted); margin-top: 1px; font-weight: 400; }
    .cat-tx-amount { font-size: 12px; font-weight: 700; color: var(--red); white-space: nowrap; flex-shrink: 0; }

    /* ── MATRIZ P&L ── */
    .matrix-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin: 20px 0 10px;
    }
    .matrix-head .section-label { margin: 0; }
    .var-toggle { display: flex; background: var(--white); border: 1.5px solid var(--border); border-radius: 20px; padding: 2px; flex-shrink: 0; }
    .var-toggle button {
      background: none; border: none; cursor: pointer; font-family: 'Outfit', sans-serif;
      font-size: 11px; font-weight: 700; color: var(--ink-muted);
      padding: 4px 12px; border-radius: 16px; transition: all 0.15s;
    }
    .var-toggle button.active { background: var(--grad); color: white; }

    .matrix-wrap {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .matrix-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .matrix-scroll::-webkit-scrollbar { height: 6px; }
    .matrix-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    table.matrix { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 11px; }
    table.matrix th, table.matrix td { padding: 7px 9px; white-space: nowrap; text-align: right; }
    table.matrix thead th {
      position: sticky; top: 0; z-index: 2;
      background: var(--bg); color: var(--ink-muted);
      font-size: 9px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    table.matrix th.cat-col, table.matrix td.cat-col {
      position: sticky; left: 0; z-index: 3;
      background: var(--white); text-align: left;
      font-weight: 600; color: var(--ink);
      max-width: 132px; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 1px 0 0 var(--border);
    }
    table.matrix thead th.cat-col { z-index: 4; background: var(--bg); }
    table.matrix tbody tr:hover td { background: var(--grad-soft); }
    table.matrix tbody tr:hover td.cat-col { background: #faf9fd; }
    table.matrix td { color: var(--ink-soft); font-weight: 500; font-variant-numeric: tabular-nums; }
    table.matrix td.sel { background: rgba(123,114,192,0.09); font-weight: 700; color: var(--ink); }
    table.matrix thead th.sel { background: rgba(123,114,192,0.16); color: var(--blue); }
    table.matrix td.zero { color: var(--ink-muted); opacity: 0.45; }
    table.matrix td.pos { color: var(--green); font-weight: 700; }
    table.matrix td.neg { color: var(--red); font-weight: 700; }
    table.matrix td.tgt { color: var(--ink-muted); font-weight: 600; }
    table.matrix .sep { box-shadow: inset 1px 0 0 var(--border); }
    table.matrix tr.grp td, table.matrix tr.grp td.cat-col {
      background: var(--bg); font-weight: 800; color: var(--ink);
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    table.matrix tr.net td, table.matrix tr.net td.cat-col {
      background: var(--ink); color: white; font-weight: 800;
      box-shadow: none;
    }
    table.matrix tr.net td.pos { color: #4ade80; }
    table.matrix tr.net td.neg { color: #fca5a5; }
    .matrix-note { font-size: 10px; color: var(--ink-muted); font-weight: 400; padding: 9px 12px; border-top: 1px solid var(--border); line-height: 1.5; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 11px;
      color: var(--ink-muted);
      font-weight: 400;
    }

    /* ── ANIMATIONS ── */
    .fade-in { opacity: 0; transform: translateY(8px); animation: fadeUp 0.35s ease forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .fade-in:nth-child(1) { animation-delay: 0.04s; }
    .fade-in:nth-child(2) { animation-delay: 0.08s; }
    .fade-in:nth-child(3) { animation-delay: 0.12s; }
    .fade-in:nth-child(4) { animation-delay: 0.16s; }
    .fade-in:nth-child(5) { animation-delay: 0.20s; }
    .fade-in:nth-child(6) { animation-delay: 0.24s; }

    /* ── SIDEBAR NAV ── */
    .nav-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .nav-overlay.open { opacity: 1; pointer-events: all; }
    .nav-sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 260px; background: var(--white); z-index: 201; transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; }
    .nav-sidebar.open { transform: translateX(0); }
    .nav-header { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .nav-logo-mark { width: 24px; height: 24px; background: var(--grad); border-radius: 6px; flex-shrink: 0; }
    .nav-logo-name { font-size: 15px; font-weight: 700; letter-spacing: -0.5px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-links { padding: 12px 8px; flex: 1; }
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: var(--ink-soft); transition: background 0.15s; }
    .nav-link:hover { background: var(--bg); color: var(--ink); }
    .nav-link.active { background: rgba(115,119,236,0.1); color: var(--blue); font-weight: 600; }
    .nav-link-icon { font-size: 18px; width: 24px; text-align: center; }
    .hamburger { background: none; border: none; cursor: pointer; padding: 8px; display: flex; flex-direction: column; gap: 4px; border-radius: 8px; transition: background 0.15s; }
    .hamburger:hover { background: var(--bg); }
    .hamburger span { display: block; width: 18px; height: 2px; background: var(--ink-soft); border-radius: 2px; }
  </style>
</head>
<body>

<!-- Sidebar nav -->
<div class="nav-overlay" id="navOverlay" onclick="closeSidebar()"></div>
<nav class="nav-sidebar" id="navSidebar">
  <div class="nav-header">
    <div class="nav-logo-mark"></div>
    <div class="nav-logo-name">Palette</div>
  </div>
  <div class="nav-links">
    <a href="/palette"    class="nav-link active"><span class="nav-link-icon">📊</span> Dashboard</a>
    <a href="/clasificar" class="nav-link"><span class="nav-link-icon">🏦</span> N26</a>
    <a href="/amex"       class="nav-link"><span class="nav-link-icon">💳</span> Interbank</a>
    <a href="/despensa"   class="nav-link"><span class="nav-link-icon">🛒</span> Despensa</a>
  </div>
</nav>

<header>
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="hamburger" onclick="openSidebar()" aria-label="Menú">
        <span></span><span></span><span></span>
      </button>
      <a href="/" class="logo">
        <div class="logo-mark"></div>
        <div class="logo-name">Palette</div>
      </a>
    </div>
    <div class="header-right">
      <div class="month-pill" id="currentMonthBadge">cargando...</div>
      <a href="/clasificar" class="classify-btn">+ Cargar</a>
    </div>
  </div>
</header>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Cargando datos...</div>
</div>

<main id="mainContent" style="display:none">

  <div class="month-tabs" id="monthTabs"></div>

  <div class="section-label">Análisis del mes</div>
  <div class="summary-card fade-in" id="summaryCard">
    <div class="summary-loading">
      <div class="spinner-sm"></div>
      Analizando...
    </div>
  </div>

  <div class="section-label">Neto del mes</div>
  <div class="hero-card fade-in">
    <div class="hero-label">True Cash Flow</div>
    <div class="hero-amount" id="heroAmount">€0</div>
    <div class="hero-note" id="heroNote">calculando...</div>
  </div>

  <div class="section-label">¿Cuánto te queda?</div>
  <div class="life-units-grid fade-in" id="lifeUnitsGrid"></div>

  <div class="section-label">Cómo se fue la plata</div>
  <div class="pl-stack fade-in" id="plStack"></div>

  <div class="section-label">Por categoría</div>
  <div class="cat-list fade-in" id="catList"></div>

  <div class="matrix-head">
    <div class="section-label">P&amp;L mensual</div>
    <div class="var-toggle" id="varToggle">
      <button class="active" onclick="setVarMode('abs')">€</button>
      <button onclick="setVarMode('pct')">%</button>
    </div>
  </div>
  <div class="matrix-wrap fade-in" id="plMatrix"></div>

  <div class="matrix-head">
    <div class="section-label">Por tarjeta</div>
  </div>
  <div class="matrix-wrap fade-in" id="cardMatrix"></div>

</main>

<footer>Palette · spark-datahub · BigQuery</footer>

<script>
const API_URL = '/api/transactions';

const INCOME_TARGET = 5136;
const TCF_TARGET    = 1776;

// Recalibrados 2026-08-13 contra el gasto real neto de feb-jul 2026.
// Suman 3.695 €/mes; con un ingreso medio de 4.892 € eso implica ahorrar ~1.197 €/mes.
const CATEGORY_TARGETS = {
  Rent: -1800, Groceries: -360, Trip: -300, Food: -240,
  Transport: -125, Delivery: -100, Other: -100, Subscription: -100,
  Services: -100, Clothing: -90, Network: -90, Housing: -70,
  Entertainment: -70, 'Online Shopping': -50, Health: -50,
  'Non Food Groceries': -30, Tech: -20,
  Pet: 0, Hair: 0, Parking: 0,
};

const LIFE_UNITS = [
  { key: 'Groceries', emoji: '🛒', label: 'idas al súper',    avgEur: 45 },
  { key: 'Delivery',  emoji: '🛵', label: 'pedidos delivery', avgEur: 12 },
  { key: 'Food',      emoji: '🍽️', label: 'salidas a comer',  avgEur: 25 },
  { key: 'Clothing',  emoji: '👗', label: 'compras de ropa',  avgEur: 60 },
];

const CAT_COLORS = {
  Rent: '#2E428B', Groceries: '#00875a', Food: '#b45309',
  Transport: '#7377EC', Health: '#7b5cbf', Clothing: '#B6346B',
  Trip: '#0891b2', Subscription: '#059669', Tech: '#4f46e5',
  Delivery: '#ea580c', Other: '#9a9aaa', Network: '#6b7280',
  Housing: '#92400e', 'Non Food Groceries': '#065f46', Hair: '#be185d',
  Entertainment: '#c026d3', 'Online Shopping': '#0d9488', Services: '#a16207',
};

let allData = [], months = [], selectedMonth = null;

function dhSalaryArrived(data) {
  return data.some(r =>
    r.commerce && r.commerce.toLowerCase().includes('delivery hero se') &&
    parseFloat(r.eur_amount) > 0
  );
}

async function loadData() {
  try {
    const res = await fetch(API_URL);
    allData = await res.json();
    const monthSet = new Set();
    allData.forEach(r => {
      const m = r.month?.value || r.month;
      if (m) monthSet.add(m.slice(0, 7));
    });
    months        = Array.from(monthSet).sort().reverse();
    selectedMonth = months[0];
    renderMonthTabs();
    renderAll();
    document.getElementById('loading').style.display    = 'none';
    document.getElementById('mainContent').style.display = 'block';
  } catch (e) {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;padding:40px 20px">
        <div style="font-size:32px;margin-bottom:12px">😬</div>
        <div style="font-size:14px;color:var(--ink-soft)">Error cargando datos</div>
        <div style="font-size:11px;color:var(--ink-muted);margin-top:6px">${e.message}</div>
      </div>`;
  }
}

function formatMonth(ym) {
  const [y, m] = ym.split('-');
  const names = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${names[parseInt(m)-1]} ${y.slice(2)}`;
}

function renderMonthTabs() {
  document.getElementById('monthTabs').innerHTML = months.map(m => `
    <div class="month-tab ${m === selectedMonth ? 'active' : ''}" onclick="selectMonth('${m}')">
      ${formatMonth(m)}
    </div>`).join('');
  document.getElementById('currentMonthBadge').textContent = formatMonth(selectedMonth);
}

function selectMonth(m) {
  selectedMonth = m;
  document.getElementById('currentMonthBadge').textContent = formatMonth(m);
  renderMonthTabs();
  renderAll();
}

function getMonthData() {
  return allData.filter(r => {
    const m = r.month?.value || r.month || '';
    return m.startsWith(selectedMonth);
  });
}

function renderAll() {
  const data = getMonthData();
  renderSummary(data);
  renderHero(data);
  renderLifeUnits(data);
  renderPL(data);
  renderCategories(data);
  renderPLMatrix();
  renderCardMatrix();
}

// ── SUMMARY CACHE (one call per month per session) ───────────────────────────
const summaryCache = {};

async function renderSummary(data) {
  const card = document.getElementById('summaryCard');

  if (summaryCache[selectedMonth]) {
    card.innerHTML = summaryCache[selectedMonth];
    return;
  }

  card.innerHTML = `<div class="summary-loading"><div class="spinner-sm"></div>Analizando...</div>`;

  const FIXED_CATS  = new Set(['Rent', 'Network', 'Transport']);
  const ONEOFF_CATS = new Set(['Trip', 'Clothing', 'Tech', 'Christmas Deco', 'Online Shopping']);

  const today          = new Date();
  const todayStr       = today.toISOString().slice(0, 10);
  const [y, m]         = selectedMonth.split('-').map(Number);
  const daysInMonth    = new Date(y, m, 0).getDate();
  const isCurrentMonth = today.getFullYear() === y && (today.getMonth() + 1) === m;
  const dayOfMonth     = isCurrentMonth ? today.getDate() : daysInMonth;
  const daysLeft       = isCurrentMonth ? daysInMonth - dayOfMonth : 0;
  const monthProgress  = Math.round((dayOfMonth / daysInMonth) * 100);
  const weeksElapsed   = dayOfMonth / 7;
  const weeksLeft      = isCurrentMonth ? daysLeft / 7 : 0;

  const prevMonth = months.find(mo => mo < selectedMonth);
  const prevMonthSpend = {};
  if (prevMonth) {
    allData.forEach(r => {
      const mo = (r.month?.value || r.month || '').slice(0, 7);
      if (mo !== prevMonth) return;
      if (!r.category || r.finance_category === 'Not Considered') return;
      const eur = parseFloat(r.eur_amount) || 0;
      if (r.category === 'Income') return;
      if (!prevMonthSpend[r.category]) prevMonthSpend[r.category] = 0;
      prevMonthSpend[r.category] -= eur;
    });
  }

  const categorySpend = {};
  data.forEach(r => {
    if (!r.category || r.finance_category === 'Not Considered') return;
    const eur = parseFloat(r.eur_amount) || 0;
    if (r.category === 'Income') return;
    if (!categorySpend[r.category]) categorySpend[r.category] = 0;
    categorySpend[r.category] -= eur;
  });

  const FOCUS_CATS = ['Groceries','Delivery','Food','Transport','Health','Clothing','Subscription','Trip','Network','Entertainment','Online Shopping','Services','Other'];

  const categoryLines = FOCUS_CATS.map(cat => {
    const spent  = Math.round(categorySpend[cat] || 0);
    const target = Math.abs(CATEGORY_TARGETS[cat] || 0);
    const prev   = prevMonthSpend[cat] ? Math.round(prevMonthSpend[cat]) : null;
    if (spent === 0 && target === 0 && !prev) return null;

    let projection = null, projectionType = 'LINEAR';

    if (isCurrentMonth && dayOfMonth > 0) {
      if (FIXED_CATS.has(cat)) {
        projection     = spent;
        projectionType = 'FIXED';
      } else if (ONEOFF_CATS.has(cat)) {
        projection     = Math.round(spent * 1.2);
        projectionType = 'ONEOFF';
      } else if (prev !== null) {
        projection     = prev;
        projectionType = 'HISTORICAL';
      } else if (['Groceries','Food','Delivery'].includes(cat) && weeksElapsed > 0) {
        const weeklyRate = spent / weeksElapsed;
        projection       = Math.round(spent + weeklyRate * weeksLeft);
        projectionType   = 'WEEKLY';
      } else if (monthProgress > 5) {
        projection     = Math.round((spent / dayOfMonth) * daysInMonth);
        projectionType = 'LINEAR';
      }
    }

    let status = 'ON_TRACK';
    if (spent > target && target > 0)                                   status = 'OVER';
    else if (projection !== null && target > 0 && projection > target * 1.1) status = 'AT_RISK';

    return { cat, spent, target, prev, projection, projectionType, status };
  }).filter(Boolean);

  const salaryArrived = dhSalaryArrived(data);
  const spentSoFar    = data.filter(r => r.finance_category !== 'Not Considered' && r.category !== 'Income').reduce((s,r) => s+(parseFloat(r.eur_amount)||0), 0);
  const income        = salaryArrived ? data.filter(r => r.finance_category === '1. Earnings Net').reduce((s,r) => s+(parseFloat(r.eur_amount)||0),0) : INCOME_TARGET;
  const grandTotal    = income + spentSoFar;

  try {
    const res  = await fetch('/api/summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        month: formatMonth(selectedMonth), monthKey: selectedMonth,
        today: todayStr, daysInMonth, dayOfMonth, daysLeft,
        monthProgress, isCurrentMonth, salaryArrived,
        grandTotal, tcfTarget: TCF_TARGET, categoryLines,
      }),
    });
    const json = await res.json();
    if (json.summary) {
      const html = `<div class="summary-ai-label">✦ Palette AI · ${formatMonth(selectedMonth)}</div><div class="summary-text">${json.summary}</div>`;
      summaryCache[selectedMonth] = html;
      card.innerHTML = html;
    } else throw new Error(json.error || 'Sin respuesta');
  } catch (e) {
    card.innerHTML = `<div class="summary-text" style="color:var(--ink-muted)">No se pudo generar el análisis.</div>`;
  }
}

function renderHero(data) {
  const salaryArrived = dhSalaryArrived(data);
  const spentSoFar    = data.filter(r => r.finance_category !== 'Not Considered' && r.category !== 'Income').reduce((s,r) => s+(parseFloat(r.eur_amount)||0), 0);
  const income        = salaryArrived ? data.filter(r => r.finance_category === '1. Earnings Net').reduce((s,r) => s+(parseFloat(r.eur_amount)||0),0) : INCOME_TARGET;
  const net           = income + spentSoFar;
  const vsTarget      = net - TCF_TARGET;

  const el     = document.getElementById('heroAmount');
  const noteEl = document.getElementById('heroNote');
  el.textContent = `€${Math.round(net).toLocaleString('de-DE')}`;
  el.className   = `hero-amount ${net >= TCF_TARGET ? '' : 'negative'}`;
  const salaryNote = salaryArrived ? '' : ' <span style="font-size:11px;opacity:0.5">(estimado)</span>';
  const vsStr      = vsTarget >= 0
    ? `+€${Math.round(vsTarget).toLocaleString('de-DE')} sobre el target 🎉`
    : `-€${Math.abs(Math.round(vsTarget)).toLocaleString('de-DE')} bajo el target`;
  noteEl.innerHTML = vsStr + salaryNote;
}

function renderLifeUnits(data) {
  document.getElementById('lifeUnitsGrid').innerHTML = LIFE_UNITS.map(u => {
    const target         = Math.abs(CATEGORY_TARGETS[u.key] || 0);
    const spent          = data.filter(r => r.category === u.key && r.finance_category !== 'Not Considered' && r.category !== 'Income').reduce((s,r) => s-(parseFloat(r.eur_amount)||0), 0);
    const remaining      = Math.max(0, target - spent);
    const unitsRemaining = Math.floor(remaining / u.avgEur);
    const pct            = target > 0 ? Math.min(100, (spent / target) * 100) : 0;
    const over           = spent > target;
    const colorClass     = over ? 'bad' : unitsRemaining <= 1 ? 'warn' : 'ok';
    const barColor       = over ? 'var(--red)' : 'var(--blue)';
    return `
      <div class="unit-card">
        <span class="unit-emoji">${u.emoji}</span>
        <div class="unit-count ${colorClass}">${unitsRemaining}</div>
        <div class="unit-label">${u.label} restantes</div>
        <div class="unit-detail">€${Math.round(spent)} de €${target}${over ? ' ⚠️' : ''}</div>
        <div style="margin-top:8px;background:var(--border);border-radius:4px;height:3px;overflow:hidden">
          <div style="height:100%;border-radius:4px;width:${pct}%;background:${barColor};transition:width 0.8s ease"></div>
        </div>
      </div>`;
  }).join('');
}

function renderPL(data) {

    { fc: '1. Earnings Net',           label: 'Ingresos',        dot: '#00875a', targetAmount: INCOME_TARGET        },
    { fc: '2. Foundational Margin',    label: 'Renta & Network', dot: '#2E428B', targetAmount: -(1800+100)           },
    { fc: '3. Vital Surplus',          label: 'Gastos vitales',  dot: '#b45309', targetAmount: -(120+40+100+80+360)  },
    { fc: '4. Quality of Life Margin', label: 'Calidad de vida', dot: '#7377EC', targetAmount: -(50+20+200)          },
    { fc: '5. True Cash Flow',         label: 'Extras & viajes', dot: '#B6346B', targetAmount: -(200+40+20+50+80+100)},
  ];

  const layers = PL_DEFS.map(def => {

            <div class="pl-dot" style="background:${l.dot}"></div>
            <div>
              <div class="pl-name">${l.label}${assumed ? ' <span style="font-size:10px;color:var(--ink-muted);font-weight:400">(estimado)</span>' : ''}</div>
              <div class="pl-sub">target: ${l.targetAmount >= 0 ? '+' : ''}€${Math.abs(l.targetAmount).toLocaleString('de-DE')}</div>
            </div>
          </div>
          <div class="pl-amount ${l.actual >= 0 ? 'pos' : 'neg'}">
            ${l.actual >= 0 ? '+' : ''}€${Math.round(l.actual).toLocaleString('de-DE')}
          </div>
        </div>`;
    }),
    `<div class="pl-row total">
      <div class="pl-left">
        <div class="pl-dot" style="background:white"></div>
        <div>
          <div class="pl-name" style="color:white">Neto del mes</div>
          <div class="pl-sub" style="color:rgba(255,255,255,0.4)">target: €${TCF_TARGET.toLocaleString('de-DE')}</div>

      </div>
    </div>`
  ].join('');
}

function renderCategories(data) {
  const catTxs = {}, cats = {};
  data.forEach(r => {
    if (!r.category || r.finance_category === 'Not Considered') return;
    const eur = parseFloat(r.eur_amount) || 0;
    if (r.category === 'Income') return;
    if (!cats[r.category])   cats[r.category]   = 0;
    if (!catTxs[r.category]) catTxs[r.category] = [];
    cats[r.category] -= eur;
    catTxs[r.category].push({ date: r.date?.value || r.date, commerce: r.commerce, eur });
  });

  const allCats = new Set([...Object.keys(cats), ...Object.keys(CATEGORY_TARGETS).filter(c => c !== 'Rent')]);
  const rows = Array.from(allCats)
    .map(c => ({ cat: c, spent: cats[c] || 0, target: Math.abs(CATEGORY_TARGETS[c] || 0), txs: catTxs[c] || [] }))
    .filter(r => r.target > 0 || r.spent > 0)
    .sort((a, b) => b.spent - a.spent);

  document.getElementById('catList').innerHTML = rows.map(r => {
    const pct       = r.target > 0 ? Math.min(100, (r.spent / r.target) * 100) : 100;
    const over      = r.spent > r.target && r.target > 0;
    const color     = over ? 'var(--red)' : (CAT_COLORS[r.cat] || '#9a9aaa');
    const remaining = r.target - r.spent;
    const txsSorted = [...r.txs].sort((a, b) => (b.date||'').localeCompare(a.date||''));
    const txHtml    = txsSorted.length > 0
      ? txsSorted.map(tx => `
          <div class="cat-tx">
            <div>
              <div class="cat-tx-vendor">${tx.commerce || '—'}</div>
              <div class="cat-tx-date">${tx.date || ''}</div>
            </div>
            <div class="cat-tx-amount" style="color:${tx.eur > 0 ? 'var(--green)' : 'var(--red)'}">${tx.eur > 0 ? '+' : '−'}€${Math.abs(tx.eur).toFixed(2)}</div>
          </div>`).join('')
      : `<div class="cat-tx"><div class="cat-tx-date">Sin transacciones</div></div>`;

    return `
      <div class="cat-row" onclick="this.classList.toggle('open')">
        <div class="cat-row-header">
          <div class="cat-bar-wrap">
            <div class="cat-name-row">
              <span class="cat-name">${r.cat}</span>
              <span class="cat-eur" style="color:${r.spent < 0 ? 'var(--green)' : over ? 'var(--red)' : 'var(--ink)'}">
                ${r.spent < 0 ? '+' : ''}€${Math.abs(Math.round(r.spent))}${r.spent < 0 ? ' neto' : ''}<span style="font-size:10px;color:var(--ink-muted);font-weight:400"> / €${r.target}</span>${over ? ' ⚠️' : ''}
              </span>
            </div>
            <div class="cat-bar-bg">
              <div class="cat-bar-fill" style="width:${pct}%;background:${color}"></div>
            </div>
            ${r.target > 0 ? `<div class="cat-remaining" style="color:${remaining >= 0 ? 'var(--green)' : 'var(--red)'}">
              ${remaining >= 0 ? `€${Math.round(remaining)} restantes` : `€${Math.abs(Math.round(remaining))} sobre el límite`}
            </div>` : ''}
          </div>
          <div class="cat-chevron">▼</div>
        </div>
        <div class="cat-detail">${txHtml}</div>
      </div>`;
  }).join('');
}

// ── MATRIZ P&L MENSUAL ───────────────────────────────────────────────────────
// Todos los meses en columnas + 4 columnas de análisis del mes seleccionado.
// Convención: gasto en positivo (neto de reembolsos), ingreso y neto en su signo real.

let varMode = 'abs';   // 'abs' = euros · 'pct' = porcentaje

function setVarMode(mode) {
  varMode = mode;
  document.querySelectorAll('#varToggle button').forEach((b, i) =>
    b.classList.toggle('active', (i === 0) === (mode === 'abs')));
  renderPLMatrix();
  renderCardMatrix();
}

// Los meses van del más viejo al más nuevo para leer la evolución de izquierda a derecha.
function matrixMonths() { return [...months].sort(); }

// Ventana del promedio: los N meses cerrados hasta el mes seleccionado inclusive.
// Son los mismos 6 meses con los que se calibraron los targets, para que 'vs Prom'
// y 'vs Target' hablen del mismo período. El mes en curso está incompleto y no promedia.
const AVG_WINDOW = 6;
function currentYM() { return new Date().toISOString().slice(0, 7); }
function avgMonths() {
  const cur    = currentYM();
  const closed = matrixMonths().filter(m => m !== cur);
  const upTo   = closed.filter(m => m <= selectedMonth);
  const pool   = upTo.length ? upTo : closed;
  return pool.slice(-AVG_WINDOW);
}

function rowMonth(r) { return (r.month?.value || r.month || '').slice(0, 7); }

// Agrega allData en { clave → { mes → importe } }. keyFn decide si agrupamos por
// categoría o por tarjeta; income=true suma solo ingresos, sin invertir el signo.
function aggregate(keyFn, { income = false } = {}) {
  const out = {};
  allData.forEach(r => {
    const m = rowMonth(r);
    if (!m) return;
    const isIncome = r.finance_category === '1. Earnings Net' || r.category === 'Income';
    if (income !== isIncome) return;
    if (!income && r.finance_category === 'Not Considered') return;
    if (!income && !r.category) return;
    const key = keyFn(r);
    if (!key) return;
    const eur = parseFloat(r.eur_amount) || 0;
    out[key] = out[key] || {};
    out[key][m] = (out[key][m] || 0) + (income ? eur : -eur);
  });
  return out;
}

function fmtEur(v, { signed = false } = {}) {
  const n = Math.round(v);
  if (n === 0) return '—';
  const s = Math.abs(n).toLocaleString('de-DE');
  return `${n < 0 ? '−' : signed ? '+' : ''}${s}`;
}

// Celda de variación. `good` indica si subir es bueno (ingreso) o malo (gasto).
function varCell(actual, ref, good, extraClass = '') {
  if (ref === null || ref === undefined) return `<td class="zero ${extraClass}">—</td>`;
  const diff = actual - ref;
  if (Math.round(diff) === 0) return `<td class="zero ${extraClass}">—</td>`;
  let txt;
  if (varMode === 'pct') {
    // Un % contra una referencia ~0 o de signo contrario no significa nada.
    if (Math.abs(ref) < 1) return `<td class="zero ${extraClass}">n/a</td>`;
    if ((ref < 0) !== (actual < 0)) return `<td class="zero ${extraClass}">n/a</td>`;
    const pct = (diff / Math.abs(ref)) * 100;
    txt = `${pct > 0 ? '+' : '−'}${Math.abs(pct) >= 999 ? '999' : Math.abs(pct).toFixed(0)}%`;
  } else {
    txt = fmtEur(diff, { signed: true });
  }
  const favorable = good ? diff > 0 : diff < 0;
  return `<td class="${favorable ? 'pos' : 'neg'} ${extraClass}">${txt}</td>`;
}

// Renderiza una tabla: filas = líneas, columnas = meses + MoM / vs Prom / vs Target / Target.
function matrixHTML(lines, note, { showTarget = true } = {}) {
  const ms   = matrixMonths();
  const avgM = avgMonths();
  const sel  = selectedMonth;
  const prev = ms[ms.indexOf(sel) - 1] ?? null;

  const head = `
    <thead><tr>
      <th class="cat-col">Línea</th>
      ${ms.map(m => `<th class="${m === sel ? 'sel' : ''}">${formatMonth(m)}</th>`).join('')}
      <th class="sep">MoM</th>
      <th>vs Prom</th>
      ${showTarget ? '<th>vs Target</th><th>Target</th>' : ''}
    </tr></thead>`;

  const body = lines.map(l => {
    const v      = m => l.values[m] || 0;
    const selVal = v(sel);
    const avg    = avgM.reduce((a, m) => a + v(m), 0) / (avgM.length || 1);
    const hasTgt = l.target !== null && l.target !== undefined;

    return `
      <tr class="${l.rowClass || ''}">
        <td class="cat-col">${l.label}</td>
        ${ms.map(m => {
          const val = v(m);
          const cls = [m === sel ? 'sel' : '', Math.round(val) === 0 ? 'zero' : ''].join(' ');
          return `<td class="${cls}">${fmtEur(val)}</td>`;
        }).join('')}
        ${varCell(selVal, prev !== null ? v(prev) : null, !!l.goodWhenHigh, 'sep')}
        ${varCell(selVal, avg, !!l.goodWhenHigh)}
        ${showTarget ? `${hasTgt ? varCell(selVal, l.target, !!l.goodWhenHigh) : '<td class="zero">—</td>'}
        <td class="tgt">${hasTgt ? fmtEur(l.target) : '—'}</td>` : ''}
      </tr>`;
  }).join('');

  return `<div class="matrix-scroll"><table class="matrix">${head}<tbody>${body}</tbody></table></div>
          ${note ? `<div class="matrix-note">${note}</div>` : ''}`;
}

function renderPLMatrix() {
  const ms      = matrixMonths();
  const byCat   = aggregate(r => r.category);
  const income  = aggregate(() => 'Ingreso', { income: true });
  const catKeys = new Set([...Object.keys(byCat), ...Object.keys(CATEGORY_TARGETS)]);

  const totalTarget = Object.values(CATEGORY_TARGETS).reduce((a, b) => a + Math.abs(b), 0);
  const sum = keys => {
    const o = {};
    ms.forEach(m => { o[m] = keys.reduce((a, k) => a + ((byCat[k] || {})[m] || 0), 0); });
    return o;
  };

  const catLines = Array.from(catKeys)
    .map(c => ({
      label:  c,
      values: byCat[c] || {},
      target: Math.abs(CATEGORY_TARGETS[c] || 0) || null,
    }))
    .filter(l => l.target || ms.some(m => Math.round(l.values[m] || 0) !== 0))
    .sort((a, b) => {
      const tot = l => ms.reduce((acc, m) => acc + (l.values[m] || 0), 0);
      return tot(b) - tot(a);
    });

  const gastoValues = sum(Array.from(catKeys));
  const incomeVals  = income['Ingreso'] || {};
  const netoValues  = {};
  ms.forEach(m => { netoValues[m] = (incomeVals[m] || 0) - (gastoValues[m] || 0); });

  const lines = [
    { label: 'Ingreso', values: incomeVals, target: INCOME_TARGET, goodWhenHigh: true, rowClass: 'grp' },
    ...catLines,
    { label: 'Gasto total', values: gastoValues, target: totalTarget, rowClass: 'grp' },
    { label: 'Neto', values: netoValues, target: INCOME_TARGET - totalTarget, goodWhenHigh: true, rowClass: 'net' },
  ];

  const avgM = avgMonths();
  const note = `Gasto neto de reembolsos, sin <em>Not Considered</em>. Verde = favorable.
    <strong>vs Prom</strong> compara ${formatMonth(selectedMonth)} contra los ${avgM.length}
    meses cerrados hasta ${formatMonth(avgM[avgM.length - 1])}.
    ${selectedMonth === currentYM()
      ? `<strong style="color:var(--amber)">${formatMonth(selectedMonth)} va incompleto</strong>: el mes en curso no promedia y sus comparaciones aún no son concluyentes.`
      : ''}`;

  document.getElementById('plMatrix').innerHTML = matrixHTML(lines, note);
}

function renderCardMatrix() {
  const ms     = matrixMonths();
  const byCard = aggregate(r => r.card);
  const cards  = Object.keys(byCard).sort((a, b) => {
    const tot = k => ms.reduce((acc, m) => acc + (byCard[k][m] || 0), 0);
    return tot(b) - tot(a);
  });

  const totals = {};
  ms.forEach(m => { totals[m] = cards.reduce((a, c) => a + (byCard[c][m] || 0), 0); });

  const lines = [
    ...cards.map(c => ({ label: c, values: byCard[c], target: null })),
    { label: 'Total', values: totals, target: null, rowClass: 'grp' },
  ];

  const selTotal = totals[selectedMonth] || 0;
  const share = cards
    .map(c => ({ c, v: byCard[c][selectedMonth] || 0 }))
    .filter(x => Math.round(x.v) !== 0)
    .sort((a, b) => b.v - a.v)
    .map(x => `${x.c} <strong>${Math.round((x.v / selTotal) * 100)}%</strong>`)
    .join(' · ');

  const note = `Reparto de ${formatMonth(selectedMonth)}: ${share || 'sin movimientos'}. Sin targets por tarjeta.`;
  document.getElementById('cardMatrix').innerHTML = matrixHTML(lines, note, { showTarget: false });
}

loadData();

function openSidebar()  {
  document.getElementById('navSidebar').classList.add('open');
  document.getElementById('navOverlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('navSidebar').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('open');
}
</script>
