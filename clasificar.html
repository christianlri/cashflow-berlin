<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palette · Clasificar</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white: #ffffff;
      --bg: #f5f5f7;
      --ink: #0a0a0f;
      --ink-soft: #4a4a5a;
      --ink-muted: #9a9aaa;
      --border: #e8e8f0;
      --blue:    #2E428B;
      --violet:  #7377EC;
      --magenta: #B6346B;
      --grad: linear-gradient(135deg, #2E428B 0%, #7377EC 50%, #B6346B 100%);
      --green:      #00875a;
      --green-soft: #e6f6f1;
      --red:        #c0392b;
      --red-soft:   #fdecea;
      --amber:      #b45309;
      --amber-soft: #fef3c7;
      --card: #ffffff;
      --radius: 14px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── HEADER ── */
    header { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 20px; position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 56px; }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-mark { width: 26px; height: 26px; background: var(--grad); border-radius: 7px; flex-shrink: 0; }
    .logo-name { font-size: 16px; font-weight: 700; letter-spacing: -0.5px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header-page { font-size: 13px; font-weight: 500; color: var(--ink-muted); }

    main { padding: 20px 16px 60px; max-width: 680px; margin: 0 auto; }

    /* ── DATES BANNER ── */
    .dates-banner { background: var(--ink); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 4px; display: flex; gap: 32px; flex-wrap: wrap; }
    .dates-item { display: flex; flex-direction: column; gap: 3px; }
    .dates-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .dates-value { font-size: 14px; color: white; font-weight: 600; }
    .dates-hint  { font-size: 10px; font-weight: 500; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-top: 1px; }

    /* ── SECTION LABEL ── */
    .section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-muted); margin: 20px 0 10px; }

    /* ── UPLOAD ZONE ── */
    .upload-zone { background: var(--white); border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 24px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .upload-zone:hover, .upload-zone.drag { border-color: var(--violet); background: rgba(115,119,236,0.04); }
    .upload-icon  { font-size: 36px; margin-bottom: 12px; }
    .upload-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--ink); }
    .upload-sub   { font-size: 12px; color: var(--ink-muted); font-weight: 400; }
    #fileInput { display: none; }

    /* ── STATS BAR ── */
    .stats-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .stat-pill { border-radius: 20px; padding: 5px 12px; font-size: 11px; font-weight: 600; border: 1.5px solid; }
    .stat-pill.green  { background: var(--green-soft);  border-color: var(--green);  color: var(--green);  }
    .stat-pill.amber  { background: var(--amber-soft);  border-color: var(--amber);  color: var(--amber);  }
    .stat-pill.violet { background: rgba(115,119,236,0.1); border-color: var(--violet); color: var(--blue); }
    .stat-pill.muted  { background: var(--bg); border-color: var(--border); color: var(--ink-muted); }

    /* ── FILTER TABS ── */
    .filter-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .filter-tab { background: var(--white); border: 1.5px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; transition: all 0.15s; font-family: 'Outfit', sans-serif; }
    .filter-tab.active { background: var(--grad); border-color: transparent; color: white; }
    .filter-tab .count { display: inline-block; background: rgba(0,0,0,0.12); border-radius: 10px; padding: 0 6px; margin-left: 4px; font-size: 10px; }
    .filter-tab.active .count { background: rgba(255,255,255,0.25); }

    /* ── TX ROWS ── */
    .rows-list { display: flex; flex-direction: column; gap: 6px; }
    .tx-row { background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; display: grid; grid-template-columns: 76px 1fr auto; gap: 8px; align-items: center; transition: border-color 0.15s; }
    .tx-row.approved { border-color: var(--green); }
    .tx-row.skipped  { opacity: 0.35; }
    .tx-date       { font-size: 11px; color: var(--ink-muted); font-weight: 400; }
    .tx-card-label { font-size: 10px; color: var(--ink-muted); margin-top: 2px; font-weight: 400; }
    .tx-vendor { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
    .tx-fc     { font-size: 10px; color: var(--ink-muted); margin-top: 2px; font-weight: 400; }
    .tx-right  { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .tx-amount { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .tx-amount.neg { color: var(--red); }
    .tx-amount.pos { color: var(--green); }

    /* ── CAT SELECT ── */
    .cat-select { font-size: 11px; font-weight: 600; border: 1.5px solid var(--border); border-radius: 8px; padding: 4px 8px; background: var(--bg); color: var(--ink); cursor: pointer; max-width: 160px; font-family: 'Outfit', sans-serif; }
    .cat-select.historical { border-color: var(--green);   background: var(--green-soft);              color: var(--green);  }
    .cat-select.inferred   { border-color: var(--amber);   background: var(--amber-soft);              color: var(--amber);  }
    .cat-select.manual     { border-color: var(--violet);  background: rgba(115,119,236,0.1);          color: var(--blue);   }
    .skip-btn { font-size: 10px; color: var(--ink-muted); background: none; border: none; cursor: pointer; padding: 2px 4px; text-decoration: underline; font-family: 'Outfit', sans-serif; font-weight: 500; }

    /* ── BOTTOM BAR ── */
    .bottom-bar { position: sticky; bottom: 0; background: var(--ink); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .bottom-info { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 400; }
    .bottom-info strong { color: white; font-weight: 600; }
    .btn { padding: 9px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: 'Outfit', sans-serif; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--grad); color: white; }
    .btn-ghost   { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }

    /* ── RESULT ── */
    #resultMsg { background: var(--green-soft); border: 1.5px solid var(--green); border-radius: var(--radius); padding: 16px; text-align: center; font-size: 14px; font-weight: 600; color: var(--green); display: none; margin-top: 16px; }

    /* ── SPINNER ── */
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { opacity: 0; animation: fadeUp 0.3s ease forwards; }
    @keyframes fadeUp { to { opacity: 1; } }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-muted); font-size: 13px; font-weight: 400; }

    /* ── SIDEBAR NAV ── */
    .nav-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .nav-overlay.open { opacity: 1; pointer-events: all; }
    .nav-sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 260px; background: var(--white); z-index: 201; transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; }
    .nav-sidebar.open { transform: translateX(0); }
    .nav-header { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .nav-logo-mark { width: 24px; height: 24px; background: var(--grad); border-radius: 6px; flex-shrink: 0; }
    .nav-logo-name { font-size: 15px; font-weight: 700; letter-spacing: -0.5px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-links { padding: 12px 8px; flex: 1; }
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: var(--ink-soft); transition: background 0.15s; }
    .nav-link:hover { background: var(--bg); color: var(--ink); }
    .nav-link.active { background: rgba(115,119,236,0.1); color: var(--blue); font-weight: 600; }
    .nav-link-icon { font-size: 18px; width: 24px; text-align: center; }
    .hamburger { background: none; border: none; cursor: pointer; padding: 8px; display: flex; flex-direction: column; gap: 4px; border-radius: 8px; transition: background 0.15s; }
    .hamburger:hover { background: var(--bg); }
    .hamburger span { display: block; width: 18px; height: 2px; background: var(--ink-soft); border-radius: 2px; }
  </style>
</head>
<body>

<!-- Sidebar nav -->
<div class="nav-overlay" id="navOverlay" onclick="closeSidebar()"></div>
<nav class="nav-sidebar" id="navSidebar">
  <div class="nav-header">
    <div class="nav-logo-mark"></div>
    <div class="nav-logo-name">Palette</div>
  </div>
  <div class="nav-links">
    <a href="/palette"    class="nav-link"><span class="nav-link-icon">📊</span> Dashboard</a>
    <a href="/clasificar" class="nav-link active"><span class="nav-link-icon">🏦</span> N26</a>
    <a href="/amex"       class="nav-link"><span class="nav-link-icon">💳</span> Interbank AMEX</a>
    <a href="/despensa"   class="nav-link"><span class="nav-link-icon">🛒</span> Despensa</a>
  </div>
</nav>

<header>
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="hamburger" onclick="openSidebar()" aria-label="Menú">
        <span></span><span></span><span></span>
      </button>
      <a href="/" class="logo">
        <div class="logo-mark"></div>
        <div class="logo-name">Palette</div>
      </a>
    </div>
    <div class="header-page">Clasificar transacciones</div>
  </div>
</header>

<main>
  <div class="section-label">Últimos registros</div>
  <div class="dates-banner" id="datesBanner">
    <div class="dates-item"><div class="dates-label">Cargando...</div></div>
  </div>

  <div class="section-label">Subir CSV de N26</div>
  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">📂</div>
    <div class="upload-title">Arrastra el CSV o click para seleccionar</div>
    <div class="upload-sub">N26 → Cuenta → Exportar transacciones → CSV</div>
    <input type="file" id="fileInput" accept=".csv" />
  </div>

  <div id="classifySection" style="display:none">
    <div class="section-label">Revisión</div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="filter-tabs">
      <div class="filter-tab active" onclick="setFilter('all')">Todas <span class="count" id="countAll">0</span></div>
      <div class="filter-tab" onclick="setFilter('review')">Revisar <span class="count" id="countReview">0</span></div>
      <div class="filter-tab" onclick="setFilter('skipped')">Omitidas <span class="count" id="countSkipped">0</span></div>
    </div>
    <div class="rows-list" id="rowsList"></div>
    <div id="resultMsg"></div>
  </div>
</main>

<div class="bottom-bar" id="bottomBar" style="display:none">
  <div class="bottom-info">
    <strong id="approvedCount">0</strong> listas · <strong id="skipCount">0</strong> omitidas
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-ghost" onclick="approveAll()">Aprobar todo</button>
    <button class="btn btn-primary" id="loadBtn" onclick="loadToDb()">Cargar a BigQuery</button>
  </div>
</div>

<script>
const CLASSIFY_API = '/api/classify';

const CATEGORY_MAP = {
  'Delivery':           { finance_category: '5. True Cash Flow',         finance_class: 'Expected Cost of Living' },
  'Pet':                { finance_category: '5. True Cash Flow',         finance_class: 'Expected Cost of Living' },
  'Food':               { finance_category: '4. Quality of Life Margin', finance_class: 'Expected Cost of Living' },
  'Service':            { finance_category: '4. Quality of Life Margin', finance_class: 'Expected Cost of Living' },
  'Services':           { finance_category: '4. Quality of Life Margin', finance_class: 'Expected Cost of Living' },
  'Subscription':       { finance_category: '4. Quality of Life Margin', finance_class: 'Expected Cost of Living' },
  'Groceries':          { finance_category: '3. Vital Surplus',          finance_class: 'Expected Cost of Living' },
  'Health':             { finance_category: '3. Vital Surplus',          finance_class: 'Expected Cost of Living' },
  'Non Food Groceries': { finance_category: '3. Vital Surplus',          finance_class: 'Expected Cost of Living' },
  'Hair':               { finance_category: '3. Vital Surplus',          finance_class: 'Expected Cost of Living' },
  'Parking':            { finance_category: '3. Vital Surplus',          finance_class: 'Expected Cost of Living' },
  'Transport':          { finance_category: '3. Vital Surplus',          finance_class: 'Expected Cost of Living' },
  'Network':            { finance_category: '2. Foundational Margin',    finance_class: 'Expected Cost of Living' },
  'Rent':               { finance_category: '2. Foundational Margin',    finance_class: 'Expected Rent'           },
  'Clothing':           { finance_category: '5. True Cash Flow',         finance_class: 'Extra & One-Offs'        },
  'Christmas Deco':     { finance_category: '5. True Cash Flow',         finance_class: 'Extra & One-Offs'        },
  'Other':              { finance_category: '5. True Cash Flow',         finance_class: 'Extra & One-Offs'        },
  'Tech':               { finance_category: '5. True Cash Flow',         finance_class: 'Extra & One-Offs'        },
  'Trip':               { finance_category: '5. True Cash Flow',         finance_class: 'Extra & One-Offs'        },
  'Housing':            { finance_category: '3. Vital Surplus',          finance_class: 'Extra & One-Offs'        },
  'Income':             { finance_category: '1. Earnings Net',           finance_class: ''                        },
  'Finance':            { finance_category: 'Not Considered',            finance_class: 'Not Considered'          },
  'Not Considered':     { finance_category: 'Not Considered',            finance_class: 'Not Considered'          },
};
const ALL_CATEGORIES = Object.keys(CATEGORY_MAP);

const INFERENCE_RULES = [
  { keywords: ['rewe', 'kaufland', 'lidl', 'netto', 'aldi', 'edeka', 'bio company', 'albert heijn', 'mustafa', 'denns', 'japan plaza', 'latino point'], cat: 'Groceries' },
  { keywords: ['wolt', 'delivery hero innovat', 'lieferando', 'pedidosya groceries'], cat: 'Delivery' },
  { keywords: ['kuchi', 'amrit', 'burger king', 'mcdonald', 'starbucks', 'kamps', 'nordsee', 'peter pane', 'ramen', 'sushi', 'ben rahim', 'kilkenny', 'backwerk', 'ditsch', 'barist', 'lsp*', 'hard rock', 'restaurant', 'cafe'], cat: 'Food' },
  { keywords: ['bvg', 'berliner verkehr', 'bolt', 'lime', 'tier', 'navigo', 'tfl', 'db retorno'], cat: 'Transport' },
  { keywords: ['apotheke', 'mediserv', 'urban sports', 'docortho', 'ap solutions', 'mediosap'], cat: 'Health' },
  { keywords: ['apple.com/bill', 'spotify', 'netflix', 'audible', 'ring', 'openai', 'suno', 'wolt plus', 'n26 subscription', 'claude.ai', 'proton'], cat: 'Subscription' },
  { keywords: ['decathlon', 'zalando', 'tk maxx', 'uniqlo', 'corporate benefits', 'sephora'], cat: 'Clothing' },
  { keywords: ['mediamarkt', 'samsung', 'anthropic'], cat: 'Tech' },
  { keywords: ['jasmin haug'], cat: 'Rent' },
  { keywords: ['telefonica', 'gocardless'], cat: 'Network' },
  { keywords: ['bauhaus', 'ikea', 'obi', 'hornbach'], cat: 'Housing' },
  { keywords: ['delivery hero se'], cat: 'Income' },
  { keywords: ['francisco del valle', 'jose enrique', 'christian la rosa', 'christian jesus', 'revolut', 'wise', 'cash26', 'n26 cash', 'rundfunk', 'landesamt', 'international baptist', 'main account', 'chris & meli'], cat: 'Finance' },
  { keywords: ['museum', 'ibis', 'abbey road', 'easyjet', 'ryanair', 'caba istanbul', 'service navigo', 'natural history', 'ziggo', 'laduree', 'haagen', 'tulip'], cat: 'Trip' },
];

function inferCategory(vendor) {
  const v = vendor.toLowerCase();
  for (const rule of INFERENCE_RULES) {
    if (rule.keywords.some(k => v.includes(k))) return rule.cat;
  }
  return null;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  function parseLine(line) {
    const result = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    result.push(cur.trim());
    return result;
  }
  const headers = parseLine(lines[0]);
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const vals = parseLine(line), row = {};
    headers.forEach((h, i) => { row[h] = (vals[i] || '').trim(); });
    return row;
  }).filter(r => r['Booking Date'] && r['Partner Name']);
}

function mapCard(accountName) {
  if (!accountName) return 'N26';
  const a = accountName.toLowerCase();
  if (a.includes('chris') || a.includes('meli')) return 'N26 Family';
  return 'N26';
}

const AUTO_SKIP = ['main account', 'chris & meli', 'n26 cash', 'christian la rosa', 'christian jesus', 'jose enrique', 'francisco del valle', 'revolut', 'wise', 'rundfunk', 'landesamt', 'international baptist'];
function shouldAutoSkip(row) {
  const v = row.commerce.toLowerCase();
  if (AUTO_SKIP.some(s => v.includes(s))) return true;
  if (row.eur_amount > 0 && row.category === 'Finance') return true;
  return false;
}

let parsedRows = [], vendorMap = {}, rowStates = [], currentFilter = 'all';

async function loadVendorMap() {
  try {
    const res  = await fetch(CLASSIFY_API);
    const data = await res.json();
    vendorMap  = data.vendorMap || {};

    const banner    = document.getElementById('datesBanner');
    const lastDates = data.lastDates || {};

    if (Object.keys(lastDates).length === 0) {
      banner.innerHTML = `<div class="dates-item"><div class="dates-label">Sin registros aún</div></div>`;
      return;
    }
    banner.innerHTML = ['N26', 'N26 Family'].map(card => {
      const d = lastDates[card];
      if (!d) return '';
      const date      = new Date(d);
      const formatted = date.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
      return `
        <div class="dates-item">
          <div class="dates-label">${card}</div>
          <div class="dates-value">${formatted}</div>
          <div class="dates-hint">Descarga desde esta fecha →</div>
        </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('datesBanner').innerHTML = `<div class="dates-item"><div class="dates-label" style="color:rgba(255,255,255,0.3)">Error cargando</div></div>`;
  }
}

loadVendorMap();

const uploadZone = document.getElementById('uploadZone');
const fileInput  = document.getElementById('fileInput');
uploadZone.addEventListener('dragover',  e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', ()  => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop',      e  => { e.preventDefault(); uploadZone.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change',     e  => handleFile(e.target.files[0]));

async function handleFile(file) {
  if (!file) return;
  uploadZone.innerHTML = `<div class="upload-icon"><span class="spinner"></span></div><div class="upload-title">Procesando...</div>`;
  const text = await file.text();
  const rows = parseCSV(text);

  parsedRows = rows.map(r => {
    const vendor     = r['Partner Name'] || '';
    const eurAmount  = parseFloat(r['Amount (EUR)']) || 0;
    const historical = vendorMap[vendor];
    const inferred   = inferCategory(vendor);
    const category   = historical || inferred || 'Other';
    const source     = historical ? 'historical' : inferred ? 'inferred' : 'manual';
    return { date: r['Booking Date'], card: mapCard(r['Account Name']), commerce: vendor, eur_amount: eurAmount, original_amount: parseFloat(r['Original Amount']) || eurAmount, currency: (r['Original Currency'] || 'eur').toLowerCase(), category, source };
  });

  rowStates = parsedRows.map(r => shouldAutoSkip(r) ? 'skipped' : 'approved');
  currentFilter = 'all';
  uploadZone.style.display = 'none';
  document.getElementById('classifySection').style.display = 'block';
  document.getElementById('bottomBar').style.display = 'flex';
  renderRows(); updateStats();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach((t, i) => {
    t.classList.toggle('active', ['all','review','skipped'][i] === f);
  });
  renderRows();
}

function renderRows() {
  const list = document.getElementById('rowsList');
  const visible = parsedRows.reduce((acc, r, i) => {
    if (currentFilter === 'all') acc.push(i);
    else if (currentFilter === 'review'  && r.source !== 'historical' && rowStates[i] !== 'skipped') acc.push(i);
    else if (currentFilter === 'skipped' && rowStates[i] === 'skipped') acc.push(i);
    return acc;
  }, []);

  if (visible.length === 0) {
    list.innerHTML = `<div class="empty-state">${currentFilter === 'review' ? '✓ Todo clasificado del historial' : 'No hay transacciones aquí'}</div>`;
    return;
  }

  list.innerHTML = visible.map(i => {
    const r      = parsedRows[i];
    const state  = rowStates[i];
    const map    = CATEGORY_MAP[r.category] || { finance_category: 'Not Considered' };
    const selCls = r.source === 'historical' ? 'historical' : r.source === 'inferred' ? 'inferred' : 'manual';
    return `
      <div class="tx-row ${state} fade-in" id="row-${i}">
        <div>
          <div class="tx-date">${r.date}</div>
          <div class="tx-card-label">${r.card}</div>
        </div>
        <div style="min-width:0">
          <div class="tx-vendor" title="${r.commerce}">${r.commerce}</div>
          <div class="tx-fc">${map.finance_category}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amount ${r.eur_amount >= 0 ? 'pos' : 'neg'}">
            ${r.eur_amount >= 0 ? '+' : ''}€${Math.abs(r.eur_amount).toFixed(2)}
          </div>
          <select class="cat-select ${selCls}" onchange="changeCategory(${i}, this.value)">
            ${ALL_CATEGORIES.map(c => `<option value="${c}"${c === r.category ? ' selected' : ''}>${c}</option>`).join('')}
          </select>
          <button class="skip-btn" onclick="toggleSkip(${i})">${state === 'skipped' ? 'restaurar' : 'omitir'}</button>
        </div>
      </div>`;
  }).join('');
}

function changeCategory(i, cat) { parsedRows[i].category = cat; parsedRows[i].source = 'manual'; rowStates[i] = 'approved'; renderRows(); updateStats(); }
function toggleSkip(i)          { rowStates[i] = rowStates[i] === 'skipped' ? 'approved' : 'skipped'; renderRows(); updateStats(); }
function approveAll()           { rowStates = rowStates.map(s => s === 'skipped' ? 'skipped' : 'approved'); renderRows(); updateStats(); }

function updateStats() {
  const approved   = rowStates.filter(s => s === 'approved').length;
  const skipped    = rowStates.filter(s => s === 'skipped').length;
  const historical = parsedRows.filter((r,i) => r.source === 'historical' && rowStates[i] !== 'skipped').length;
  const inferred   = parsedRows.filter((r,i) => r.source === 'inferred'   && rowStates[i] !== 'skipped').length;
  const manual     = parsedRows.filter((r,i) => r.source === 'manual'     && rowStates[i] !== 'skipped').length;
  const toReview   = parsedRows.filter((r,i) => r.source !== 'historical' && rowStates[i] !== 'skipped').length;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-pill green">✓ ${historical} del historial</div>
    <div class="stat-pill amber">~ ${inferred} inferidas</div>
    ${manual > 0 ? `<div class="stat-pill violet">✎ ${manual} manuales</div>` : ''}
    ${skipped > 0 ? `<div class="stat-pill muted">⊘ ${skipped} omitidas</div>` : ''}
  `;
  document.getElementById('approvedCount').textContent = approved;
  document.getElementById('skipCount').textContent     = skipped;
  document.getElementById('countAll').textContent      = parsedRows.length;
  document.getElementById('countReview').textContent   = toReview;
  document.getElementById('countSkipped').textContent  = skipped;
}

async function loadToDb() {
  const btn    = document.getElementById('loadBtn');
  const toLoad = parsedRows.filter((_, i) => rowStates[i] === 'approved');
  if (!toLoad.length) return;
  btn.innerHTML = '<span class="spinner"></span> Cargando...';
  btn.disabled  = true;
  try {
    const res  = await fetch(CLASSIFY_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rows: toLoad }) });
    const data = await res.json();
    if (data.inserted) {
      const msg = document.getElementById('resultMsg');
      msg.style.display = 'block';
      msg.textContent   = `✓ ${data.inserted} transacciones cargadas a BigQuery`;
      document.getElementById('bottomBar').style.display = 'none';
    } else throw new Error(data.error || 'Error desconocido');
  } catch (e) {
    btn.innerHTML = '⚠️ Error — reintentar';
    btn.disabled  = false;
    alert('Error: ' + e.message);
  }
}

function openSidebar()  {
  document.getElementById('navSidebar').classList.add('open');
  document.getElementById('navOverlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('navSidebar').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('open');
}
</script>
</body>
</html>
