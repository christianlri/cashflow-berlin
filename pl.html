<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palette · P&amp;L</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white: #ffffff;
      --bg: #f5f5f7;
      --ink: #0a0a0f;
      --ink-soft: #4a4a5a;
      --ink-muted: #9a9aaa;
      --border: #e8e8f0;

      --blue:    #5B52A0;
      --violet:  #7B72C0;
      --magenta: #C47B8E;
      --grad: linear-gradient(135deg, #7B72C0 0%, #BCC0DC 55%, #C47B8E 100%);
      --grad-soft: linear-gradient(135deg, rgba(123,114,192,0.08) 0%, rgba(188,192,220,0.08) 55%, rgba(196,123,142,0.08) 100%);

      --green:      #00875a;
      --red:        #c0392b;
      --amber:      #b45309;

      --card: #ffffff;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-mark { width: 28px; height: 28px; background: var(--grad); border-radius: 8px; flex-shrink: 0; }
    .logo-name {
      font-size: 18px; font-weight: 700; letter-spacing: -0.5px;
      background: var(--grad); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .month-pill {
      background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
      padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--ink-soft);
    }
    .classify-btn {
      background: var(--grad); color: white; border: none; border-radius: 20px;
      padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: 'Outfit', sans-serif; text-decoration: none; display: inline-block;
    }

    /* ── LOADING ── */
    #loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 80px 32px; gap: 14px;
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--violet); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: var(--ink-muted); font-weight: 400; }

    /* ── MAIN ── */
    /* Más ancho que el dashboard: acá el contenido son tablas, no tarjetas. */
    main { padding: 16px 16px 60px; max-width: 720px; margin: 0 auto; }

    /* ── MONTH TABS ── */
    .month-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
    .month-tabs::-webkit-scrollbar { display: none; }
    .month-tab {
      background: var(--white); border: 1.5px solid var(--border); border-radius: 20px;
      padding: 5px 14px; font-size: 12px; font-weight: 600; color: var(--ink-soft);
      cursor: pointer; white-space: nowrap; transition: all 0.15s;
      font-family: 'Outfit', sans-serif; flex-shrink: 0;
    }
    .month-tab.active { background: var(--grad); border-color: transparent; color: white; }

    .tabs-hint { font-size: 10px; color: var(--ink-muted); font-weight: 400; margin: -6px 0 4px; }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--ink-muted); margin: 20px 0 10px;
    }

    /* ── KPI DE AHORRO ── */
    .kpi-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
    .kpi-tile {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
    }
    .kpi-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--ink-muted); margin-bottom: 6px;
    }
    .kpi-value { font-size: 26px; font-weight: 800; letter-spacing: -1px; line-height: 1; font-variant-numeric: tabular-nums; }
    .kpi-tile.hero .kpi-value { font-size: 34px; }
    .kpi-sub { font-size: 11px; color: var(--ink-muted); font-weight: 400; margin-top: 6px; }
    .kpi-value.pos { color: var(--green); }
    .kpi-value.neg { color: var(--red); }

    /* ── GRÁFICO ── */
    .chart-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 12px 10px; position: relative;
    }
    .chart-card svg { display: block; width: 100%; height: auto; }
    .chart-legend {
      display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
      padding: 10px 6px 0; font-size: 10px; color: var(--ink-muted); font-weight: 500;
    }
    .lg-item { display: flex; align-items: center; gap: 6px; }
    .lg-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .lg-line { width: 14px; height: 0; border-top: 2px solid var(--ink); flex-shrink: 0; }
    .chart-tip {
      position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.12s;
      background: var(--ink); color: white; border-radius: var(--radius-sm);
      padding: 8px 10px; font-size: 11px; line-height: 1.5; white-space: nowrap;
      z-index: 10; transform: translate(-50%, -100%);
    }
    .chart-tip .tip-m { font-weight: 700; margin-bottom: 2px; }
    .chart-tip .tip-r { color: rgba(255,255,255,0.65); }
    .chart-tip .tip-r b { color: white; font-weight: 600; }
    .bar-hit { cursor: pointer; }

    /* ── MATRIZ P&L ── */
    .matrix-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin: 20px 0 10px;
    }
    .matrix-head .section-label { margin: 0; }
    .var-toggle { display: flex; background: var(--white); border: 1.5px solid var(--border); border-radius: 20px; padding: 2px; flex-shrink: 0; }
    .var-toggle button {
      background: none; border: none; cursor: pointer; font-family: 'Outfit', sans-serif;
      font-size: 11px; font-weight: 700; color: var(--ink-muted);
      padding: 4px 12px; border-radius: 16px; transition: all 0.15s;
    }
    .var-toggle button.active { background: var(--grad); color: white; }

    .matrix-wrap {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .matrix-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .matrix-scroll::-webkit-scrollbar { height: 6px; }
    .matrix-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    table.matrix { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 11px; }
    table.matrix th, table.matrix td { padding: 7px 9px; white-space: nowrap; text-align: right; }
    table.matrix thead th {
      position: sticky; top: 0; z-index: 2;
      background: var(--bg); color: var(--ink-muted);
      font-size: 9px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    table.matrix th.cat-col, table.matrix td.cat-col {
      position: sticky; left: 0; z-index: 3;
      background: var(--white); text-align: left;
      font-weight: 600; color: var(--ink);
      max-width: 132px; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 1px 0 0 var(--border);
    }
    table.matrix thead th.cat-col { z-index: 4; background: var(--bg); }
    table.matrix tbody tr:hover td { background: var(--grad-soft); }
    table.matrix tbody tr:hover td.cat-col { background: #faf9fd; }
    table.matrix td { color: var(--ink-soft); font-weight: 500; font-variant-numeric: tabular-nums; }
    table.matrix td.sel { background: rgba(123,114,192,0.09); font-weight: 700; color: var(--ink); }
    table.matrix thead th.sel { background: rgba(123,114,192,0.16); color: var(--blue); }
    table.matrix td.zero { color: var(--ink-muted); opacity: 0.45; }
    table.matrix td.pos { color: var(--green); font-weight: 700; }
    table.matrix td.neg { color: var(--red); font-weight: 700; }
    table.matrix td.tgt { color: var(--ink-muted); font-weight: 600; }
    table.matrix .sep { box-shadow: inset 1px 0 0 var(--border); }
    table.matrix tr.grp td, table.matrix tr.grp td.cat-col {
      background: var(--bg); font-weight: 800; color: var(--ink);
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    table.matrix tr.net td, table.matrix tr.net td.cat-col {
      background: var(--ink); color: white; font-weight: 800;
      box-shadow: none;
    }
    table.matrix tr.net td.pos { color: #4ade80; }
    table.matrix tr.net td.neg { color: #fca5a5; }
    .matrix-note { font-size: 10px; color: var(--ink-muted); font-weight: 400; padding: 9px 12px; border-top: 1px solid var(--border); line-height: 1.5; }

    /* ── FOOTER ── */
    footer { text-align: center; padding: 20px; font-size: 11px; color: var(--ink-muted); font-weight: 400; }

    /* ── ANIMATIONS ── */
    .fade-in { opacity: 0; transform: translateY(8px); animation: fadeUp 0.35s ease forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    /* ── SIDEBAR NAV ── */
    .nav-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .nav-overlay.open { opacity: 1; pointer-events: all; }
    .nav-sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 260px; background: var(--white); z-index: 201; transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; }
    .nav-sidebar.open { transform: translateX(0); }
    .nav-header { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .nav-logo-mark { width: 24px; height: 24px; background: var(--grad); border-radius: 6px; flex-shrink: 0; }
    .nav-logo-name { font-size: 15px; font-weight: 700; letter-spacing: -0.5px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-links { padding: 12px 8px; flex: 1; }
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: var(--ink-soft); transition: background 0.15s; }
    .nav-link:hover { background: var(--bg); color: var(--ink); }
    .nav-link.active { background: rgba(115,119,236,0.1); color: var(--blue); font-weight: 600; }
    .nav-link-icon { font-size: 18px; width: 24px; text-align: center; }
    .hamburger { background: none; border: none; cursor: pointer; padding: 8px; display: flex; flex-direction: column; gap: 4px; border-radius: 8px; transition: background 0.15s; }
    .hamburger:hover { background: var(--bg); }
    .hamburger span { display: block; width: 18px; height: 2px; background: var(--ink-soft); border-radius: 2px; }
  </style>
</head>
<body>

<div class="nav-overlay" id="navOverlay" onclick="closeSidebar()"></div>
<nav class="nav-sidebar" id="navSidebar">
  <div class="nav-header">
    <div class="nav-logo-mark"></div>
    <div class="nav-logo-name">Palette</div>
  </div>
  <div class="nav-links">
    <a href="/palette"    class="nav-link"><span class="nav-link-icon">📊</span> Dashboard</a>
    <a href="/pl"         class="nav-link active"><span class="nav-link-icon">📑</span> P&amp;L</a>
    <a href="/clasificar" class="nav-link"><span class="nav-link-icon">🏦</span> N26</a>
    <a href="/amex"       class="nav-link"><span class="nav-link-icon">💳</span> Interbank</a>
    <a href="/despensa"   class="nav-link"><span class="nav-link-icon">🛒</span> Despensa</a>
  </div>
</nav>

<header>
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="hamburger" onclick="openSidebar()" aria-label="Menú">
        <span></span><span></span><span></span>
      </button>
      <a href="/" class="logo">
        <div class="logo-mark"></div>
        <div class="logo-name">Palette</div>
      </a>
    </div>
    <div class="header-right">
      <div class="month-pill" id="currentMonthBadge">cargando...</div>
      <a href="/palette" class="classify-btn">Dashboard</a>
    </div>
  </div>
</header>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Cargando datos...</div>
</div>

<main id="mainContent" style="display:none">

  <div class="month-tabs" id="monthTabs"></div>
  <div class="tabs-hint">El mes elegido se resalta en la tabla y alimenta las columnas de análisis.</div>

  <div class="section-label">Ahorro del mes</div>
  <div class="kpi-row fade-in" id="kpiRow"></div>

  <div class="section-label">Evolución del gasto</div>
  <div class="chart-card fade-in" id="chartCard">
    <div id="chartSvg"></div>
    <div class="chart-legend" id="chartLegend"></div>
    <div class="chart-tip" id="chartTip"></div>
  </div>

  <div class="matrix-head">
    <div class="section-label">P&amp;L mensual</div>
    <div class="var-toggle" id="varToggle">
      <button class="active" onclick="setVarMode('abs')">€</button>
      <button onclick="setVarMode('pct')">%</button>
    </div>
  </div>
  <div class="matrix-wrap fade-in" id="plMatrix"></div>

  <div class="matrix-head">
    <div class="section-label">Por tarjeta</div>
  </div>
  <div class="matrix-wrap fade-in" id="cardMatrix"></div>

</main>

<footer>Palette · spark-datahub · BigQuery</footer>

<script src="/targets.js"></script>
<script>
const API_URL = '/api/transactions';

const CATEGORY_TARGETS = window.CATEGORY_TARGETS || {};
const INCOME_TARGET    = window.INCOME_TARGET    || 0;

let allData = [], months = [], selectedMonth = null;

async function loadData() {
  try {
    const res = await fetch(API_URL);
    allData = await res.json();
    const monthSet = new Set();
    allData.forEach(r => {
      const m = r.month?.value || r.month;
      if (m) monthSet.add(m.slice(0, 7));
    });
    months        = Array.from(monthSet).sort().reverse();
    selectedMonth = months[0];
    renderMonthTabs();
    renderAll();
    document.getElementById('loading').style.display     = 'none';
    document.getElementById('mainContent').style.display = 'block';
  } catch (e) {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;padding:40px 20px">
        <div style="font-size:32px;margin-bottom:12px">😬</div>
        <div style="font-size:14px;color:var(--ink-soft)">Error cargando datos</div>
        <div style="font-size:11px;color:var(--ink-muted);margin-top:6px">${e.message}</div>
      </div>`;
  }
}

function formatMonth(ym) {
  const [y, m] = ym.split('-');
  const names = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${names[parseInt(m)-1]} ${y.slice(2)}`;
}

function renderMonthTabs() {
  document.getElementById('monthTabs').innerHTML = months.map(m => `
    <div class="month-tab ${m === selectedMonth ? 'active' : ''}" onclick="selectMonth('${m}')">
      ${formatMonth(m)}
    </div>`).join('');
  document.getElementById('currentMonthBadge').textContent = formatMonth(selectedMonth);
}

function selectMonth(m) {
  selectedMonth = m;
  renderMonthTabs();
  renderAll();
}

function renderAll() {
  renderKPI();
  renderChart();
  renderPLMatrix();
  renderCardMatrix();
}

// ── MATRIZ P&L MENSUAL ───────────────────────────────────────────────────────
// Todos los meses en columnas + 4 columnas de análisis del mes seleccionado.
// Convención: gasto en positivo (neto de reembolsos), ingreso y neto en su signo real.

let varMode = 'abs';   // 'abs' = euros · 'pct' = porcentaje

function setVarMode(mode) {
  varMode = mode;
  document.querySelectorAll('#varToggle button').forEach((b, i) =>
    b.classList.toggle('active', (i === 0) === (mode === 'abs')));
  renderPLMatrix();
  renderCardMatrix();
}

// Los meses van del más viejo al más nuevo para leer la evolución de izquierda a derecha.
function matrixMonths() { return [...months].sort(); }

// Ventana del promedio: los N meses cerrados hasta el mes seleccionado inclusive.
// Son los mismos 6 meses con los que se calibraron los targets, para que 'vs Prom'
// y 'vs Target' hablen del mismo período. El mes en curso está incompleto y no promedia.
const AVG_WINDOW = 6;
function currentYM() { return new Date().toISOString().slice(0, 7); }
function avgMonths() {
  const cur    = currentYM();
  const closed = matrixMonths().filter(m => m !== cur);
  const upTo   = closed.filter(m => m <= selectedMonth);
  const pool   = upTo.length ? upTo : closed;
  return pool.slice(-AVG_WINDOW);
}

function rowMonth(r) { return (r.month?.value || r.month || '').slice(0, 7); }

// Agrega allData en { clave → { mes → importe } }. keyFn decide si agrupamos por
// categoría o por tarjeta; income=true suma solo ingresos, sin invertir el signo.
function aggregate(keyFn, { income = false } = {}) {
  const out = {};
  allData.forEach(r => {
    const m = rowMonth(r);
    if (!m) return;
    const isIncome = r.finance_category === '1. Earnings Net' || r.category === 'Income';
    if (income !== isIncome) return;
    if (!income && r.finance_category === 'Not Considered') return;
    if (!income && !r.category) return;
    const key = keyFn(r);
    if (!key) return;
    const eur = parseFloat(r.eur_amount) || 0;
    out[key] = out[key] || {};
    out[key][m] = (out[key][m] || 0) + (income ? eur : -eur);
  });
  return out;
}

function fmtEur(v, { signed = false } = {}) {
  const n = Math.round(v);
  if (n === 0) return '—';
  const s = Math.abs(n).toLocaleString('de-DE');
  return `${n < 0 ? '−' : signed ? '+' : ''}${s}`;
}

// Celda de variación. `good` indica si subir es bueno (ingreso) o malo (gasto).
function varCell(actual, ref, good, extraClass = '') {
  if (ref === null || ref === undefined) return `<td class="zero ${extraClass}">—</td>`;
  const diff = actual - ref;
  if (Math.round(diff) === 0) return `<td class="zero ${extraClass}">—</td>`;
  let txt;
  if (varMode === 'pct') {
    // Un % contra una referencia ~0 o de signo contrario no significa nada.
    if (Math.abs(ref) < 1) return `<td class="zero ${extraClass}">n/a</td>`;
    if ((ref < 0) !== (actual < 0)) return `<td class="zero ${extraClass}">n/a</td>`;
    const pct = (diff / Math.abs(ref)) * 100;
    txt = `${pct > 0 ? '+' : '−'}${Math.abs(pct) >= 999 ? '999' : Math.abs(pct).toFixed(0)}%`;
  } else {
    txt = fmtEur(diff, { signed: true });
  }
  const favorable = good ? diff > 0 : diff < 0;
  return `<td class="${favorable ? 'pos' : 'neg'} ${extraClass}">${txt}</td>`;
}

// Renderiza una tabla: filas = líneas, columnas = meses + MoM / vs Prom / vs Target / Target.
function matrixHTML(lines, note, { showTarget = true } = {}) {
  const ms   = matrixMonths();
  const avgM = avgMonths();
  const sel  = selectedMonth;
  const prev = ms[ms.indexOf(sel) - 1] ?? null;

  const head = `
    <thead><tr>
      <th class="cat-col">Línea</th>
      ${ms.map(m => `<th class="${m === sel ? 'sel' : ''}">${formatMonth(m)}</th>`).join('')}
      <th class="sep">MoM</th>
      <th>vs Prom</th>
      ${showTarget ? '<th>vs Target</th><th>Target</th>' : ''}
    </tr></thead>`;

  const body = lines.map(l => {
    const v      = m => l.values[m] || 0;
    const selVal = v(sel);
    const avg    = avgM.reduce((a, m) => a + v(m), 0) / (avgM.length || 1);
    const hasTgt = l.target !== null && l.target !== undefined;

    return `
      <tr class="${l.rowClass || ''}">
        <td class="cat-col">${l.label}</td>
        ${ms.map(m => {
          const val = v(m);
          const cls = [m === sel ? 'sel' : '', Math.round(val) === 0 ? 'zero' : ''].join(' ');
          const mark = (l.assumed || []).includes(m) ? '*' : '';
          return `<td class="${cls}">${fmtEur(val)}${mark}</td>`;
        }).join('')}
        ${varCell(selVal, prev !== null ? v(prev) : null, !!l.goodWhenHigh, 'sep')}
        ${varCell(selVal, avg, !!l.goodWhenHigh)}
        ${showTarget ? `${hasTgt ? varCell(selVal, l.target, !!l.goodWhenHigh) : '<td class="zero">—</td>'}
        <td class="tgt">${hasTgt ? fmtEur(l.target) : '—'}</td>` : ''}
      </tr>`;
  }).join('');

  return `<div class="matrix-scroll"><table class="matrix">${head}<tbody>${body}</tbody></table></div>
          ${note ? `<div class="matrix-note">${note}</div>` : ''}`;
}

// Serie base que comparten la matriz, el KPI de ahorro y el gráfico.
// El sueldo cae a fin de mes: mientras no esté registrado, el mes en curso
// asume el target de ingreso. Sin esto el ahorro del mes vivo sale negativo
// por construcción (gastos completos contra ingreso cero).
function plSeries() {
  const ms          = matrixMonths();
  const byCat       = aggregate(r => r.category);
  const catKeys     = Array.from(new Set([...Object.keys(byCat), ...Object.keys(CATEGORY_TARGETS)]));
  const totalTarget = Object.values(CATEGORY_TARGETS).reduce((a, b) => a + Math.abs(b), 0);
  const cur         = currentYM();

  const gasto = {};
  ms.forEach(m => { gasto[m] = catKeys.reduce((a, k) => a + ((byCat[k] || {})[m] || 0), 0); });

  const income   = { ...(aggregate(() => 'Ingreso', { income: true })['Ingreso'] || {}) };
  const assumed  = [];
  if (ms.includes(cur) && Math.round(income[cur] || 0) === 0) {
    income[cur] = INCOME_TARGET;
    assumed.push(cur);
  }

  const ahorro = {};
  ms.forEach(m => { ahorro[m] = (income[m] || 0) - (gasto[m] || 0); });

  return { ms, byCat, catKeys, totalTarget, gasto, income, ahorro, assumed,
           ahorroTarget: INCOME_TARGET - totalTarget };
}

function renderPLMatrix() {
  const s = plSeries();

  const catLines = s.catKeys
    .map(c => ({
      label:  c,
      values: s.byCat[c] || {},
      target: Math.abs(CATEGORY_TARGETS[c] || 0) || null,
    }))
    .filter(l => l.target || s.ms.some(m => Math.round(l.values[m] || 0) !== 0))
    .sort((a, b) => {
      const tot = l => s.ms.reduce((acc, m) => acc + (l.values[m] || 0), 0);
      return tot(b) - tot(a);
    });

  const lines = [
    { label: 'Ingreso', values: s.income, target: INCOME_TARGET, goodWhenHigh: true, rowClass: 'grp', assumed: s.assumed },
    ...catLines,
    { label: 'Gasto total', values: s.gasto, target: s.totalTarget, rowClass: 'grp' },
    { label: 'Ahorro', values: s.ahorro, target: s.ahorroTarget, goodWhenHigh: true, rowClass: 'net', assumed: s.assumed },
  ];

  const avgM = avgMonths();
  const note = `Gasto neto de reembolsos, sin <em>Not Considered</em>. Verde = favorable.
    <strong>vs Prom</strong> compara ${formatMonth(selectedMonth)} contra los ${avgM.length}
    meses cerrados hasta ${formatMonth(avgM[avgM.length - 1])}.
    ${s.assumed.length
      ? ` <strong>*</strong> ${formatMonth(s.assumed[0])} todavía no registra sueldo: se asume el target de ingreso
          (${fmtEur(INCOME_TARGET)} €) para que el ahorro no salga falseado.`
      : ''}
    ${selectedMonth === currentYM()
      ? `<strong style="color:var(--amber)">${formatMonth(selectedMonth)} va incompleto</strong>: el mes en curso no promedia y sus gastos aún no están todos.`
      : ''}`;

  document.getElementById('plMatrix').innerHTML = matrixHTML(lines, note);
}

// ── KPI DE AHORRO ────────────────────────────────────────────────────────────
function renderKPI() {
  const s    = plSeries();
  const real = s.ahorro[selectedMonth] || 0;
  const tgt  = s.ahorroTarget;
  const diff = real - tgt;
  const isAssumed = s.assumed.includes(selectedMonth);

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-tile hero">
      <div class="kpi-label">Ahorro ${formatMonth(selectedMonth)}</div>
      <div class="kpi-value ${real >= 0 ? 'pos' : 'neg'}">${real < 0 ? '−' : ''}€${Math.abs(Math.round(real)).toLocaleString('de-DE')}</div>
      <div class="kpi-sub">${isAssumed ? 'con el ingreso asumido · mes en curso' : `ingreso €${Math.round(s.income[selectedMonth] || 0).toLocaleString('de-DE')} − gasto €${Math.round(s.gasto[selectedMonth] || 0).toLocaleString('de-DE')}`}</div>
    </div>
    <div class="kpi-tile">
      <div class="kpi-label">Target</div>
      <div class="kpi-value">€${Math.round(tgt).toLocaleString('de-DE')}</div>
      <div class="kpi-sub">${Math.round((tgt / INCOME_TARGET) * 100)}% del ingreso</div>
    </div>
    <div class="kpi-tile">
      <div class="kpi-label">Diferencia</div>
      <div class="kpi-value ${diff >= 0 ? 'pos' : 'neg'}">${diff >= 0 ? '+' : '−'}€${Math.abs(Math.round(diff)).toLocaleString('de-DE')}</div>
      <div class="kpi-sub">${diff >= 0 ? 'sobre el target' : 'bajo el target'}</div>
    </div>`;
}

// ── GRÁFICO DE EVOLUCIÓN ─────────────────────────────────────────────────────
// Columnas = gasto total del mes · línea sólida = target. Una sola serie, así
// que no lleva leyenda de series: los dos colores son estado (dentro/sobre el
// target) y van rotulados. Clic en una barra selecciona el mes.
const BAR_OK   = '#7B72C0';   // violeta Palette — dentro del target
const BAR_OVER = '#c0392b';   // rojo — sobre el target
const CHART = { w: 680, h: 200, padT: 18, padB: 26, padL: 44, padR: 8, maxBar: 24, r: 4 };

function barPath(x, y, w, h, r) {
  const rr = Math.min(r, h, w / 2);
  if (h <= 0) return '';
  // Extremo superior redondeado, base cuadrada sobre la línea de cero.
  return `M${x},${y + h} L${x},${y + rr} Q${x},${y} ${x + rr},${y}
          L${x + w - rr},${y} Q${x + w},${y} ${x + w},${y + rr} L${x + w},${y + h} Z`;
}

// El último tick tiene que quedar POR ENCIMA del máximo, o las barras altas
// se dibujan fuera del área del gráfico.
function niceTicks(max) {
  const step = Math.pow(10, Math.floor(Math.log10(max / 3)));
  const mult = [1, 2, 2.5, 5, 10].find(m => max / (step * m) <= 3.2) || 10;
  const s    = step * mult;
  const out  = [];
  for (let v = 0; ; v += s) { out.push(v); if (v >= max) break; }
  return out;
}

function renderChart() {
  const s   = plSeries();
  const ms  = s.ms;
  const tgt = s.totalTarget;
  const { w, h, padT, padB, padL, padR, maxBar } = CHART;

  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  const maxV  = Math.max(tgt, ...ms.map(m => s.gasto[m] || 0)) * 1.12;
  const ticks = niceTicks(maxV);
  const top   = ticks[ticks.length - 1];
  const y     = v => padT + plotH - (v / top) * plotH;
  const band  = plotW / ms.length;
  const bw    = Math.min(maxBar, band * 0.55);

  const grid = ticks.map(t => `
    <line x1="${padL}" y1="${y(t).toFixed(1)}" x2="${w - padR}" y2="${y(t).toFixed(1)}"
          stroke="var(--border)" stroke-width="1" />
    <text x="${padL - 8}" y="${(y(t) + 3).toFixed(1)}" text-anchor="end"
          font-size="9" fill="var(--ink-muted)">${t === 0 ? '0' : (t / 1000).toFixed(t % 1000 ? 1 : 0) + 'k'}</text>`).join('');

  const cur = currentYM();
  const bars = ms.map((m, i) => {
    const v    = s.gasto[m] || 0;
    const x    = padL + band * i + (band - bw) / 2;
    const bh   = Math.max(0, y(0) - y(v));
    const over = v > tgt;
    const sel  = m === selectedMonth;
    // El mes en curso lleva trama: su barra es baja porque faltan días, no
    // porque se esté gastando menos. Sin esto se lee como un mes bueno.
    const partial = m === cur;
    return `
      <path d="${barPath(x, y(v), bw, bh, CHART.r)}" fill="${over ? BAR_OVER : BAR_OK}"
            opacity="${sel ? 1 : 0.72}" />
      ${partial ? `<path d="${barPath(x, y(v), bw, bh, CHART.r)}" fill="url(#hatch)" />` : ''}
      ${sel ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(y(v) - 6).toFixed(1)}" text-anchor="middle"
            font-size="10" font-weight="700" fill="var(--ink)">${fmtEur(v)}</text>` : ''}
      <text x="${(x + bw / 2).toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="9"
            font-weight="${sel ? 700 : 500}" fill="${sel ? 'var(--ink)' : 'var(--ink-muted)'}">${formatMonth(m)}</text>
      <rect class="bar-hit" x="${(padL + band * i).toFixed(1)}" y="${padT}" width="${band.toFixed(1)}" height="${plotH}"
            fill="transparent" data-m="${m}" />`;
  }).join('');

  document.getElementById('chartSvg').innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" role="img"
         aria-label="Gasto mensual contra el target de ${Math.round(tgt)} euros">
      <defs>
        <pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="5" stroke="var(--white)" stroke-width="2.2" />
        </pattern>
      </defs>
      ${grid}
      ${bars}
      <line x1="${padL}" y1="${y(tgt).toFixed(1)}" x2="${w - padR}" y2="${y(tgt).toFixed(1)}"
            stroke="var(--ink)" stroke-width="2" stroke-linecap="round" />
      <text x="${w - padR}" y="${(y(tgt) - 6).toFixed(1)}" text-anchor="end"
            font-size="9" font-weight="700" fill="var(--ink)">target ${fmtEur(tgt)}</text>
    </svg>`;

  document.getElementById('chartLegend').innerHTML = `
    <div class="lg-item"><span class="lg-swatch" style="background:${BAR_OK}"></span> Dentro del target</div>
    <div class="lg-item"><span class="lg-swatch" style="background:${BAR_OVER}"></span> Sobre el target</div>
    <div class="lg-item"><span class="lg-line"></span> Target ${fmtEur(tgt)} €/mes</div>
    ${ms.includes(currentYM())
      ? `<div class="lg-item"><span class="lg-swatch" style="background:repeating-linear-gradient(45deg,${BAR_OK},${BAR_OK} 2px,#fff 2px,#fff 4px)"></span> ${formatMonth(currentYM())} va incompleto</div>`
      : ''}`;

  const tip  = document.getElementById('chartTip');
  const card = document.getElementById('chartCard');
  card.querySelectorAll('.bar-hit').forEach(hit => {
    hit.addEventListener('click', () => selectMonth(hit.dataset.m));
    hit.addEventListener('mouseleave', () => { tip.style.opacity = '0'; });
    hit.addEventListener('mousemove', ev => {
      const m    = hit.dataset.m;
      const v    = s.gasto[m] || 0;
      const diff = v - tgt;
      const box  = card.getBoundingClientRect();
      tip.innerHTML = `
        <div class="tip-m">${formatMonth(m)}</div>
        <div class="tip-r">Gasto <b>€${Math.round(v).toLocaleString('de-DE')}</b></div>
        <div class="tip-r">${diff > 0 ? 'Sobre' : 'Bajo'} target <b>€${Math.abs(Math.round(diff)).toLocaleString('de-DE')}</b></div>
        <div class="tip-r">Ahorro <b>${s.ahorro[m] < 0 ? '−' : ''}€${Math.abs(Math.round(s.ahorro[m] || 0)).toLocaleString('de-DE')}</b></div>`;
      // Se ancla al cursor pero sin salirse de la tarjeta: en los meses de los
      // extremos, y sobre todo en móvil, si no se acota queda cortado.
      tip.style.opacity = '1';
      const half = tip.offsetWidth / 2;
      const xRaw = ev.clientX - box.left;
      tip.style.left = `${Math.max(half + 4, Math.min(box.width - half - 4, xRaw))}px`;
      tip.style.top  = `${ev.clientY - box.top - 12}px`;
    });
  });
}

function renderCardMatrix() {
  const ms     = matrixMonths();
  const byCard = aggregate(r => r.card);
  const cards  = Object.keys(byCard).sort((a, b) => {
    const tot = k => ms.reduce((acc, m) => acc + (byCard[k][m] || 0), 0);
    return tot(b) - tot(a);
  });

  const totals = {};
  ms.forEach(m => { totals[m] = cards.reduce((a, c) => a + (byCard[c][m] || 0), 0); });

  const lines = [
    ...cards.map(c => ({ label: c, values: byCard[c], target: null })),
    { label: 'Total', values: totals, target: null, rowClass: 'grp' },
  ];

  const selTotal = totals[selectedMonth] || 0;
  const share = cards
    .map(c => ({ c, v: byCard[c][selectedMonth] || 0 }))
    .filter(x => Math.round(x.v) !== 0)
    .sort((a, b) => b.v - a.v)
    .map(x => `${x.c} <strong>${Math.round((x.v / selTotal) * 100)}%</strong>`)
    .join(' · ');

  const note = `Reparto de ${formatMonth(selectedMonth)}: ${share || 'sin movimientos'}. Sin targets por tarjeta.`;
  document.getElementById('cardMatrix').innerHTML = matrixHTML(lines, note, { showTarget: false });
}

loadData();

function openSidebar()  {
  document.getElementById('navSidebar').classList.add('open');
  document.getElementById('navOverlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('navSidebar').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('open');
}
</script>
