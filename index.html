<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chris & Meli · Berlin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1a1612;
      --ink-soft: #6b6560;
      --ink-muted: #b0aca7;
      --accent: #c94040;
      --accent-soft: #f0dada;
      --green: #3a7a5a;
      --green-soft: #d4ece0;
      --amber: #b07020;
      --amber-soft: #f5e8cc;
      --card: #ffffff;
      --border: #e8e2d8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 0;
    }

    /* ── HEADER ── */
    header {
      background: var(--ink);
      color: #fff;
      padding: 28px 32px 24px;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 180px; height: 180px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.15;
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .header-title span {
      color: var(--accent);
      font-style: italic;
    }
    .header-subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
      font-weight: 300;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .month-badge {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
      white-space: nowrap;
    }

    /* ── LOADING ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
      gap: 12px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: 13px;
      color: var(--ink-muted);
      font-weight: 300;
    }

    /* ── MAIN ── */
    main {
      padding: 20px 20px 40px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 28px 0 12px;
    }

    /* ── TRUE CASH FLOW HERO ── */
    .hero-card {
      background: var(--ink);
      border-radius: 20px;
      padding: 24px;
      color: #fff;
      position: relative;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .hero-card::after {
      content: '';
      position: absolute;
      bottom: -30px; right: -30px;
      width: 120px; height: 120px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.12;
    }
    .hero-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
    }
    .hero-amount {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }
    .hero-amount.positive { color: #6dd4a0; }
    .hero-amount.negative { color: #e88080; }
    .hero-note {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      margin-top: 8px;
    }

    /* ── LIFE UNITS ── */
    .life-units-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .unit-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px 16px;
      border: 1px solid var(--border);
      transition: transform 0.15s ease;
    }
    .unit-card:active { transform: scale(0.98); }
    .unit-emoji {
      font-size: 24px;
      margin-bottom: 8px;
      display: block;
    }
    .unit-count {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.5px;
    }
    .unit-count.ok { color: var(--green); }
    .unit-count.warn { color: var(--amber); }
    .unit-count.bad { color: var(--accent); }
    .unit-label {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 4px;
      font-weight: 400;
    }
    .unit-detail {
      font-size: 10px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    /* ── P&L LAYERS ── */
    .pl-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pl-row {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .pl-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pl-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pl-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
    }
    .pl-sub {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 1px;
    }
    .pl-amount {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }
    .pl-amount.pos { color: var(--green); }
    .pl-amount.neg { color: var(--accent); }

    /* ── CATEGORY BREAKDOWN ── */
    .cat-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cat-row {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .cat-row:hover { border-color: var(--ink-muted); }
    .cat-row.open { border-color: var(--ink); }
    .cat-row-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cat-bar-wrap { flex: 1; }
    .cat-name-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
    }
    .cat-name { font-size: 12px; font-weight: 500; color: var(--ink); }
    .cat-eur  { font-size: 12px; font-weight: 500; color: var(--ink); }
    .cat-bar-bg { background: var(--border); border-radius: 4px; height: 4px; overflow: hidden; }
    .cat-bar-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .cat-chevron { font-size: 10px; color: var(--ink-muted); transition: transform 0.2s; flex-shrink: 0; }
    .cat-row.open .cat-chevron { transform: rotate(180deg); }

    /* ── TX DETAIL LIST ── */
    .cat-detail {
      display: none;
      border-top: 1px solid var(--border);
      padding: 8px 0;
    }
    .cat-row.open .cat-detail { display: block; }
    .cat-tx {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px;
      gap: 8px;
    }
    .cat-tx:hover { background: var(--bg); }
    .cat-tx-left { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .cat-tx-vendor { font-size: 12px; font-weight: 400; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .cat-tx-date { font-size: 10px; color: var(--ink-muted); }
    .cat-tx-amount { font-size: 12px; font-weight: 600; color: var(--accent); white-space: nowrap; flex-shrink: 0; }

    /* ── SUMMARY CARD ── */
    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 4px;
      position: relative;
      overflow: hidden;
    }
    .summary-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--accent);
      border-radius: 3px 0 0 3px;
    }
    .summary-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .summary-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-soft);
    }
    .summary-loading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--ink-muted);
    }
    .spinner-dark {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--ink-muted);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    /* ── MONTH SELECTOR ── */
    .month-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      margin-bottom: 4px;
    }
    .month-tabs::-webkit-scrollbar { display: none; }
    .month-tab {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-soft);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .month-tab.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* ── ANIMATIONS ── */
    .fade-in {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.4s ease forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in:nth-child(1) { animation-delay: 0.05s; }
    .fade-in:nth-child(2) { animation-delay: 0.1s; }
    .fade-in:nth-child(3) { animation-delay: 0.15s; }
    .fade-in:nth-child(4) { animation-delay: 0.2s; }
    .fade-in:nth-child(5) { animation-delay: 0.25s; }
    .fade-in:nth-child(6) { animation-delay: 0.3s; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="header-title">Chris & <span>Meli</span></div>
      <div class="header-subtitle">Berlin · Cashflow</div>
    </div>
    <div class="month-badge" id="currentMonthBadge">cargando...</div>
  </div>
</header>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Cargando tus gastos...</div>
</div>

<main id="mainContent" style="display:none">

  <!-- MONTH TABS -->
  <div class="month-tabs" id="monthTabs"></div>

  <!-- SUMMARY -->
  <div class="section-label">Análisis del mes</div>
  <div class="summary-card fade-in" id="summaryCard">
    <div class="summary-loading">
      <div class="spinner-dark"></div>
      Analizando el mes...
    </div>
  </div>

  <!-- TRUE CASH FLOW -->
  <div class="section-label">Tu plata libre</div>
  <div class="hero-card fade-in">
    <div class="hero-label">True Cash Flow</div>
    <div class="hero-amount" id="heroAmount">€0</div>
    <div class="hero-note" id="heroNote">después de todo</div>
  </div>

  <!-- LIFE UNITS -->
  <div class="section-label">¿Cuánto te queda en cosas reales?</div>
  <div class="life-units-grid fade-in" id="lifeUnitsGrid"></div>

  <!-- P&L LAYERS -->
  <div class="section-label">Cómo se fue la plata</div>
  <div class="pl-stack fade-in" id="plStack"></div>

  <!-- CATEGORY BREAKDOWN -->
  <div class="section-label">Por categoría</div>
  <div class="cat-list fade-in" id="catList"></div>

</main>

<footer>Actualizado desde BigQuery · spark-datahub</footer>

<script>
const API_URL = '/api/transactions';

// ── TARGETS ──────────────────────────────────────────────────────────────────
const INCOME_TARGET = 5136;
const TCF_TARGET = 1776;

const CATEGORY_TARGETS = {
  Rent:                 -1800,
  Network:               -100,
  Transport:             -120,
  'Non Food Groceries':   -40,
  Housing:               -100,
  Health:                 -80,
  Hair:                     0,
  Parking:                  0,
  Groceries:             -360,
  Subscription:           -50,
  Services:               -20,
  Food:                  -200,
  Trip:                  -200,
  Tech:                   -40,
  Pet:                    -20,
  Other:                  -50,
  Delivery:               -80,
  Clothing:              -100,
};

const LIFE_UNITS = [
  { key: 'Groceries', emoji: '🛒', label: 'idas al súper',    avgEur: 45 },
  { key: 'Delivery',  emoji: '🛵', label: 'pedidos delivery', avgEur: 12 },
  { key: 'Food',      emoji: '🍽️', label: 'salidas a comer',  avgEur: 25 },
  { key: 'Clothing',  emoji: '👗', label: 'compras de ropa',  avgEur: 60 },
];

let allData = [];
let months = [];
let selectedMonth = null;

function dhSalaryArrived(data) {
  return data.some(r =>
    r.commerce && r.commerce.toLowerCase().includes('delivery hero se') &&
    parseFloat(r.eur_amount) > 0
  );
}

async function loadData() {
  try {
    const res = await fetch(API_URL);
    allData = await res.json();

    // Extract unique months
    const monthSet = new Set();
    allData.forEach(r => {
      const m = r.month?.value || r.month;
      if (m) monthSet.add(m.slice(0, 7)); // YYYY-MM
    });
    months = Array.from(monthSet).sort().reverse();
    selectedMonth = months[0];

    renderMonthTabs();
    renderAll();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
  } catch (e) {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;padding:40px 20px">
        <div style="font-size:32px;margin-bottom:12px">😬</div>
        <div style="font-size:14px;color:#6b6560">Error cargando datos</div>
        <div style="font-size:11px;color:#b0aca7;margin-top:6px">${e.message}</div>
      </div>`;
  }
}

function formatMonth(ym) {
  const [y, m] = ym.split('-');
  const names = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${names[parseInt(m)-1]} ${y.slice(2)}`;
}

function renderMonthTabs() {
  const container = document.getElementById('monthTabs');
  container.innerHTML = months.map(m => `
    <div class="month-tab ${m === selectedMonth ? 'active' : ''}" onclick="selectMonth('${m}')">
      ${formatMonth(m)}
    </div>
  `).join('');

  document.getElementById('currentMonthBadge').textContent = formatMonth(selectedMonth);
}

function selectMonth(m) {
  selectedMonth = m;
  document.getElementById('currentMonthBadge').textContent = formatMonth(m);
  renderMonthTabs();
  renderAll();
}

function getMonthData() {
  return allData.filter(r => {
    const m = r.month?.value || r.month || '';
    return m.startsWith(selectedMonth);
  });
}

function renderAll() {
  const data = getMonthData();
  renderSummary(data);
  renderHero(data);
  renderLifeUnits(data);
  renderPL(data);
  renderCategories(data);
}

async function renderSummary(data) {
  const card = document.getElementById('summaryCard');
  card.innerHTML = `<div class="summary-loading"><div class="spinner-dark"></div>Analizando el mes...</div>`;

  // Build category spend map
  const categorySpend = {};
  data.forEach(r => {
    if (!r.category || r.finance_category === 'Not Considered') return;
    const eur = parseFloat(r.eur_amount) || 0;
    if (eur >= 0) return;
    if (!categorySpend[r.category]) categorySpend[r.category] = 0;
    categorySpend[r.category] += Math.abs(eur);
  });

  const salaryArrived = dhSalaryArrived(data);
  const spentSoFar = data
    .filter(r => r.finance_category !== 'Not Considered' && parseFloat(r.eur_amount) < 0)
    .reduce((s, r) => s + (parseFloat(r.eur_amount) || 0), 0);
  const income = salaryArrived
    ? data.filter(r => r.finance_category === '1. Earnings Net').reduce((s,r) => s+(parseFloat(r.eur_amount)||0),0)
    : INCOME_TARGET;
  const grandTotal = income + spentSoFar;

  try {
    const res = await fetch('/api/summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        month: formatMonth(selectedMonth),
        categorySpend,
        targets: CATEGORY_TARGETS,
        grandTotal,
        tcfTarget: TCF_TARGET,
        salaryArrived,
      }),
    });
    const json = await res.json();
    if (json.summary) {
      card.innerHTML = `
        <div class="summary-label">✦ Claude · ${formatMonth(selectedMonth)}</div>
        <div class="summary-text">${json.summary}</div>`;
    } else {
      throw new Error(json.error || 'Sin respuesta');
    }
  } catch (e) {
    card.innerHTML = `<div class="summary-text" style="color:var(--ink-muted)">No se pudo generar el análisis.</div>`;
  }
}

function renderHero(data) {
  const salaryArrived = dhSalaryArrived(data);
  const spentSoFar = data
    .filter(r => r.finance_category !== 'Not Considered' && parseFloat(r.eur_amount) < 0)
    .reduce((s, r) => s + (parseFloat(r.eur_amount) || 0), 0);
  const income = salaryArrived
    ? data.filter(r => r.finance_category === '1. Earnings Net').reduce((s,r) => s+(parseFloat(r.eur_amount)||0),0)
    : INCOME_TARGET;
  const net = income + spentSoFar;
  const vsTarget = net - TCF_TARGET;

  const el = document.getElementById('heroAmount');
  const noteEl = document.getElementById('heroNote');
  el.textContent = `€${Math.round(net).toLocaleString('de-DE')}`;
  el.className = `hero-amount ${net >= TCF_TARGET ? 'positive' : 'negative'}`;
  const salaryNote = salaryArrived ? '' : ' <span style="font-size:11px;opacity:0.5">(sueldo estimado)</span>';
  const vsStr = vsTarget >= 0
    ? `+€${Math.round(vsTarget).toLocaleString('de-DE')} sobre el target 🎉`
    : `-€${Math.abs(Math.round(vsTarget)).toLocaleString('de-DE')} bajo el target 😬`;
  noteEl.innerHTML = vsStr + salaryNote;
}

function renderLifeUnits(data) {
  const grid = document.getElementById('lifeUnitsGrid');
  grid.innerHTML = LIFE_UNITS.map(u => {
    const target = Math.abs(CATEGORY_TARGETS[u.key] || 0);
    const spent = data
      .filter(r => r.category === u.key && r.finance_category !== 'Not Considered')
      .reduce((s, r) => s + Math.abs(parseFloat(r.eur_amount) || 0), 0);
    const remaining = Math.max(0, target - spent);
    const unitsRemaining = Math.floor(remaining / u.avgEur);
    const pct = target > 0 ? Math.min(100, (spent / target) * 100) : 0;
    const over = spent > target;
    const colorClass = over ? 'bad' : unitsRemaining <= 1 ? 'warn' : 'ok';
    return `
      <div class="unit-card">
        <span class="unit-emoji">${u.emoji}</span>
        <div class="unit-count ${colorClass}">${unitsRemaining}</div>
        <div class="unit-label">${u.label} restantes</div>
        <div class="unit-detail">€${Math.round(spent)} de €${target}${over ? ' ⚠️' : ''}</div>
        <div style="margin-top:8px;background:#e8e2d8;border-radius:4px;height:3px;overflow:hidden">
          <div style="height:100%;border-radius:4px;width:${pct}%;background:${over ? '#c94040' : '#3a7a5a'};transition:width 0.8s ease"></div>
        </div>
      </div>`;
  }).join('');
}

function renderPL(data) {
  const stack = document.getElementById('plStack');
  const salaryArrived = dhSalaryArrived(data);

  const PL_DEFS = [
    { fc: '1. Earnings Net',           label: 'Ingresos',        dot: '#3a7a5a', targetAmount: INCOME_TARGET       },
    { fc: '2. Foundational Margin',    label: 'Renta & Network', dot: '#c94040', targetAmount: -(1800+100)          },
    { fc: '3. Vital Surplus',          label: 'Gastos vitales',  dot: '#b07020', targetAmount: -(120+40+100+80+360) },
    { fc: '4. Quality of Life Margin', label: 'Calidad de vida', dot: '#5b8cbf', targetAmount: -(50+20+200)         },
    { fc: '5. True Cash Flow',         label: 'Extras & viajes', dot: '#1a1612', targetAmount: -(200+40+20+50+80+100) },
  ];

  const layers = PL_DEFS.map(def => {
    let actual = data
      .filter(r => r.finance_category === def.fc)
      .reduce((s, r) => s + (parseFloat(r.eur_amount) || 0), 0);
    if (def.fc === '1. Earnings Net' && !salaryArrived) actual = INCOME_TARGET;
    return { ...def, actual };
  });

  const spentSoFar = data
    .filter(r => r.finance_category !== 'Not Considered' && parseFloat(r.eur_amount) < 0)
    .reduce((s, r) => s + (parseFloat(r.eur_amount) || 0), 0);
  const income = salaryArrived
    ? data.filter(r => r.finance_category === '1. Earnings Net').reduce((s,r) => s+(parseFloat(r.eur_amount)||0),0)
    : INCOME_TARGET;
  const grandTotal = income + spentSoFar;

  stack.innerHTML = [
    ...layers.map(l => {
      const assumed = l.fc === '1. Earnings Net' && !salaryArrived;
      return `
        <div class="pl-row">
          <div class="pl-left">
            <div class="pl-dot" style="background:${l.dot}"></div>
            <div>
              <div class="pl-name">${l.label}${assumed ? ' <span style="font-size:10px;color:#b0aca7">(estimado)</span>' : ''}</div>
              <div class="pl-sub">target: ${l.targetAmount >= 0 ? '+' : ''}€${Math.abs(l.targetAmount).toLocaleString('de-DE')}</div>
            </div>
          </div>
          <div class="pl-amount ${l.actual >= 0 ? 'pos' : 'neg'}">
            ${l.actual >= 0 ? '+' : ''}€${Math.round(l.actual).toLocaleString('de-DE')}
          </div>
        </div>`;
    }),
    `<div class="pl-row" style="border-color:#1a1612;background:#1a1612">
      <div class="pl-left">
        <div class="pl-dot" style="background:#fff"></div>
        <div>
          <div class="pl-name" style="color:#fff;font-weight:600">Neto del mes</div>
          <div class="pl-sub" style="color:rgba(255,255,255,0.4)">target: €${TCF_TARGET.toLocaleString('de-DE')}</div>
        </div>
      </div>
      <div class="pl-amount ${grandTotal >= TCF_TARGET ? 'pos' : 'neg'}" style="font-size:20px">
        ${grandTotal >= 0 ? '+' : ''}€${Math.round(grandTotal).toLocaleString('de-DE')}
      </div>
    </div>`
  ].join('');
}

function renderCategories(data) {
  const catColors = {
    Rent: '#c94040', Groceries: '#3a7a5a', Food: '#b07020',
    Transport: '#5b8cbf', Health: '#7b5cbf', Clothing: '#bf5b8c',
    Trip: '#5bbfb0', Subscription: '#8cbf5b', Tech: '#4a7cbf',
    Delivery: '#e08050', Other: '#b0aca7', Network: '#6b6560',
    Housing: '#a07040', 'Non Food Groceries': '#60a070', Hair: '#c090b0',
  };

  // Build transactions per category
  const catTxs = {};
  const cats   = {};
  data.forEach(r => {
    if (!r.category || r.finance_category === 'Not Considered') return;
    const eur = parseFloat(r.eur_amount) || 0;
    if (eur >= 0) return;
    if (!cats[r.category])   cats[r.category]   = 0;
    if (!catTxs[r.category]) catTxs[r.category] = [];
    cats[r.category] += Math.abs(eur);
    catTxs[r.category].push({ date: r.date?.value || r.date, commerce: r.commerce, eur });
  });

  const allCats = new Set([...Object.keys(cats), ...Object.keys(CATEGORY_TARGETS).filter(c => c !== 'Rent')]);
  const rows = Array.from(allCats)
    .map(c => ({ cat: c, spent: cats[c] || 0, target: Math.abs(CATEGORY_TARGETS[c] || 0), txs: catTxs[c] || [] }))
    .filter(r => r.target > 0 || r.spent > 0)
    .sort((a, b) => b.spent - a.spent);

  document.getElementById('catList').innerHTML = rows.map(r => {
    const pct       = r.target > 0 ? Math.min(100, (r.spent / r.target) * 100) : 100;
    const over      = r.spent > r.target && r.target > 0;
    const color     = catColors[r.cat] || '#b0aca7';
    const remaining = r.target - r.spent;

    // Sort txs by date desc
    const txsSorted = [...r.txs].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    const txHtml = txsSorted.length > 0 ? txsSorted.map(tx => `
      <div class="cat-tx">
        <div class="cat-tx-left">
          <div class="cat-tx-vendor">${tx.commerce || '—'}</div>
          <div class="cat-tx-date">${tx.date || ''}</div>
        </div>
        <div class="cat-tx-amount">−€${Math.abs(tx.eur).toFixed(2)}</div>
      </div>`).join('') : `<div class="cat-tx"><div class="cat-tx-date" style="padding:4px 0">Sin transacciones</div></div>`;

    return `
      <div class="cat-row" onclick="this.classList.toggle('open')">
        <div class="cat-row-header">
          <div class="cat-bar-wrap">
            <div class="cat-name-row">
              <span class="cat-name">${r.cat}</span>
              <span class="cat-eur" style="color:${over ? '#c94040' : '#1a1612'}">
                €${Math.round(r.spent)} <span style="font-size:10px;color:#b0aca7">/ €${r.target}</span>${over ? ' ⚠️' : ''}
              </span>
            </div>
            <div class="cat-bar-bg">
              <div class="cat-bar-fill" style="width:${pct}%;background:${over ? '#c94040' : color}"></div>
            </div>
            ${r.target > 0 ? `<div style="font-size:10px;color:${remaining >= 0 ? '#3a7a5a' : '#c94040'};margin-top:3px">
              ${remaining >= 0 ? `€${Math.round(remaining)} restantes` : `€${Math.abs(Math.round(remaining))} sobre el límite`}
            </div>` : ''}
          </div>
          <div class="cat-chevron">▼</div>
        </div>
        <div class="cat-detail">${txHtml}</div>
      </div>`;
  }).join('');
}

loadData();
</script>
