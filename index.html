<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palette</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white: #ffffff;
      --bg: #f5f5f7;
      --ink: #0a0a0f;
      --ink-soft: #4a4a5a;
      --ink-muted: #9a9aaa;
      --border: #e8e8f0;
      --blue:    #2E428B;
      --violet:  #7377EC;
      --magenta: #B6346B;
      --grad: linear-gradient(135deg, #2E428B 0%, #7377EC 50%, #B6346B 100%);
      --green:      #00875a;
      --green-soft: #e6f6f1;
      --radius: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LOGO ── */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
    }
    .logo-mark {
      width: 56px; height: 56px;
      background: var(--grad);
      border-radius: 16px;
    }
    .logo-name {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      font-size: 13px;
      color: var(--ink-muted);
      font-weight: 400;
      margin-top: -6px;
    }

    /* ── CARDS ── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }

    .nav-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }
    .nav-card:hover {
      border-color: var(--violet);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(115,119,236,0.12);
    }
    .nav-card:active {
      transform: translateY(0);
    }

    .nav-card.primary {
      background: var(--grad);
      border-color: transparent;
      color: white;
    }
    .nav-card.primary:hover {
      box-shadow: 0 4px 20px rgba(46,66,139,0.3);
    }

    .card-icon {
      font-size: 28px;
      flex-shrink: 0;
      width: 44px;
      text-align: center;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .nav-card.primary .card-title { color: white; }
    .card-desc {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 2px;
      font-weight: 400;
    }
    .nav-card.primary .card-desc { color: rgba(255,255,255,0.65); }

    .card-arrow {
      font-size: 16px;
      color: var(--ink-muted);
      flex-shrink: 0;
    }
    .nav-card.primary .card-arrow { color: rgba(255,255,255,0.6); }

    /* ── ANIMATIONS ── */
    .logo-wrap { animation: fadeUp 0.4s ease both; }
    .nav-card:nth-child(1) { animation: fadeUp 0.4s 0.08s ease both; }
    .nav-card:nth-child(2) { animation: fadeUp 0.4s 0.14s ease both; }
    .nav-card:nth-child(3) { animation: fadeUp 0.4s 0.20s ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    footer {
      margin-top: 40px;
      font-size: 11px;
      color: var(--ink-muted);
      font-weight: 400;
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <div class="logo-mark"></div>
    <div class="logo-name">Palette</div>
    <div class="logo-sub">¿Qué querés hacer hoy?</div>
  </div>

  <div class="cards">
    <a href="/palette" class="nav-card primary">
      <div class="card-icon">📊</div>
      <div class="card-body">
        <div class="card-title">Ver Palette</div>
        <div class="card-desc">Dashboard de cashflow del mes</div>
      </div>
      <div class="card-arrow">→</div>
    </a>

    <a href="/clasificar" class="nav-card">
      <div class="card-icon">📂</div>
      <div class="card-body">
        <div class="card-title">Cargar CSV</div>
        <div class="card-desc">Subir extracto de N26 y clasificar transacciones</div>
      </div>
      <div class="card-arrow">→</div>
    </a>

    <a href="/despensa" class="nav-card">
      <div class="card-icon">🧾</div>
      <div class="card-body">
        <div class="card-title">Cargar ticket</div>
        <div class="card-desc">Subir eBon del súper y ver historial de precios</div>
      </div>
      <div class="card-arrow">→</div>
    </a>
  </div>

  <footer>Palette · spark-datahub · BigQuery</footer>

</body>
</html>
